<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F7FAF7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Consultório">
<title>Consultório</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&icon_names=account_balance_wallet,account_circle,add,apps,auto_awesome,bookmark_add,calendar_month,check,chevron_left,chevron_right,content_copy,done,download,edit_note,event,event_available,event_busy,event_repeat,group,local_fire_department,logout,movie,music_note,open_in_new,payments,person_add,photo_camera,psychology,receipt_long,savings,smart_display,space_dashboard,sync,task_alt,verified,wb_sunny&display=block" rel="stylesheet">
<style>
:root{
  --primary:#2E6A55;--on-primary:#FFFFFF;--primary-container:#B2F0D4;--on-primary-container:#002116;
  --secondary-container:#CEE9DB;--on-secondary-container:#082017;
  --tertiary:#3D6373;--tertiary-container:#C1E8FB;
  --error:#BA1A1A;--error-container:#FFDAD6;--on-error-container:#410002;
  --warn:#8A5100;--warn-container:#FFDDB8;
  --surface:#F6FBF6;--surface-dim:#D6DBD7;--surface-c-lowest:#FFFFFF;--surface-c-low:#F0F5F0;--surface-c:#EAEFEA;--surface-c-high:#E4EAE5;--surface-c-highest:#DFE4DF;
  --on-surface:#171D1A;--on-surface-variant:#404944;--outline:#707973;--outline-variant:#C0C9C2;
  --chart-1:#2E6A55;--chart-2:#3D6373;--chart-3:#8A5100;--chart-4:#BA1A1A;
  --font:'Roboto Flex',Roboto,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r-sm:8px;--r-md:12px;--r-lg:16px;--r-xl:28px;
  --e1:0 1px 2px rgba(0,0,0,.18),0 1px 3px 1px rgba(0,0,0,.08);
  --e3:0 4px 8px 3px rgba(0,0,0,.10),0 1px 3px rgba(0,0,0,.18);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --primary:#96D4B9;--on-primary:#00382A;--primary-container:#0F513F;--on-primary-container:#B2F0D4;
  --secondary-container:#344C41;--on-secondary-container:#CEE9DB;
  --tertiary:#A5CCDF;--tertiary-container:#244C5B;
  --error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;
  --warn:#FFB95F;--warn-container:#693C00;
  --surface:#0F1512;--surface-dim:#0F1512;--surface-c-lowest:#0A0F0D;--surface-c-low:#171D1A;--surface-c:#1B211E;--surface-c-high:#252B28;--surface-c-highest:#303633;
  --on-surface:#DEE4DF;--on-surface-variant:#C0C9C2;--outline:#8A938C;--outline-variant:#404944;
  --chart-1:#96D4B9;--chart-2:#A5CCDF;--chart-3:#FFB95F;--chart-4:#FFB4AB;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--surface);color:var(--on-surface);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
.hidden{display:none!important}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:22px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased;vertical-align:middle;font-variation-settings:'FILL' 0}
.ms.fill{font-variation-settings:'FILL' 1}
h1,h2,h3{margin:0;font-weight:500}
.display{font-size:30px;font-weight:500;letter-spacing:-.01em}
.title-l{font-size:22px;font-weight:500}
.title-m{font-size:16px;font-weight:600;letter-spacing:.01em}
.label{font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--on-surface-variant)}
.muted{color:var(--on-surface-variant)}
.small{font-size:13px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border-radius:20px;border:none;cursor:pointer;font-weight:600;font-size:14px;letter-spacing:.01em;background:var(--primary);color:var(--on-primary);transition:box-shadow .15s,filter .15s;white-space:nowrap}
.btn:hover{box-shadow:var(--e1);filter:brightness(1.05)}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outlined{background:transparent;color:var(--primary);border:1px solid var(--outline)}
.btn.text{background:transparent;color:var(--primary);padding:0 12px}
.btn.danger{background:transparent;color:var(--error);border:1px solid var(--outline-variant)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:20px;border:none;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--on-surface-variant)}
.icon-btn:hover{background:var(--surface-c-high)}
.fab{position:fixed;right:24px;bottom:24px;height:56px;padding:0 20px;border-radius:16px;border:none;background:var(--primary-container);color:var(--on-primary-container);box-shadow:var(--e3);display:inline-flex;align-items:center;gap:10px;font-weight:600;cursor:pointer;z-index:30}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--outline-variant);background:transparent;cursor:pointer;font-size:13px;font-weight:500;color:var(--on-surface-variant);white-space:nowrap}
.chip.on{background:var(--secondary-container);color:var(--on-secondary-container);border-color:transparent}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 10px;border-radius:12px;font-size:12px;font-weight:600;white-space:nowrap}
.b-ok{background:var(--primary-container);color:var(--on-primary-container)}
.b-info{background:var(--tertiary-container);color:var(--on-surface)}
.b-warn{background:var(--warn-container);color:var(--on-surface)}
.b-err{background:var(--error-container);color:var(--on-error-container)}
.b-neutral{background:var(--surface-c-highest);color:var(--on-surface-variant)}

/* fields */
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:12px;font-weight:600;color:var(--on-surface-variant)}
.field input,.field select,.field textarea{height:48px;border:1px solid var(--outline);border-radius:var(--r-sm);background:transparent;padding:0 14px;outline:none}
.field textarea{height:auto;min-height:88px;padding:12px 14px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border:2px solid var(--primary);padding-left:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 12px}

/* auth */
.auth{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.auth .card{width:100%;max-width:420px;padding:32px}
.brandmark{display:flex;align-items:center;gap:10px;margin-bottom:20px}
.brandmark .logo{width:40px;height:40px;border-radius:12px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center}

/* layout */
.app{display:grid;grid-template-columns:96px 1fr;min-height:100dvh}
.rail{position:sticky;top:0;height:100dvh;background:var(--surface);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:4px;border-right:1px solid var(--outline-variant)}
.rail .logo{width:44px;height:44px;border-radius:14px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;margin-bottom:18px}
.nav{display:flex;flex-direction:column;align-items:center;gap:4px;border:none;background:none;cursor:pointer;color:var(--on-surface-variant);font-size:12px;font-weight:600;padding:4px 0;width:80px}
.nav .pill{width:56px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .15s}
.nav:hover .pill{background:var(--surface-c-high)}
.nav.on{color:var(--on-surface)}
.nav.on .pill{background:var(--secondary-container);color:var(--on-secondary-container)}
.nav.on .ms{font-variation-settings:'FILL' 1}
.rail .sp{flex:1}
.main{min-width:0;padding:24px 32px 120px}
.wrap{max-width:1200px;margin:0 auto}
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar .sp{flex:1}
.monthsel{display:inline-flex;align-items:center;gap:2px;background:var(--surface-c);border-radius:20px;padding:4px}
.monthsel strong{font-weight:600;min-width:150px;text-align:center;font-size:14px}
.monthsel .icon-btn{width:32px;height:32px}
.card{background:var(--surface-c-low);border-radius:var(--r-lg);padding:20px}
.card.elev{background:var(--surface-c-lowest);box-shadow:var(--e1)}
.card+.card{margin-top:16px}
.dash>.card{margin-top:0}
.cardhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{background:var(--surface-c-lowest);border-radius:var(--r-lg);padding:16px;box-shadow:var(--e1);cursor:pointer;border:none;text-align:left;transition:transform .12s}
.kpi:hover{transform:translateY(-1px)}
.kpi .k-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;margin-bottom:10px}
.kpi .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--on-surface-variant)}
.dash{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:16px}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{cursor:pointer;transition:opacity .15s}
.chart .bar:hover{opacity:.82}
.chart text{font-family:var(--font);fill:var(--on-surface-variant);font-size:12px}
.chart .val{fill:var(--on-surface);font-weight:600;font-size:13px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--on-surface-variant)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--outline-variant)}
.row:last-child{border-bottom:none}
.row.click{cursor:pointer;border-radius:var(--r-sm)}
.row.click:hover{background:var(--surface-c)}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--tertiary-container);color:var(--on-surface);display:grid;place-items:center;font-weight:600;flex:none}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:13px;color:var(--on-surface-variant)}
.num{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.empty{padding:28px 8px;text-align:center;color:var(--on-surface-variant)}
.empty .ms{font-size:40px;display:block;margin:0 auto 8px;opacity:.6}

/* agenda */
.dayhead{font-size:13px;font-weight:600;color:var(--primary);margin:18px 4px 4px;text-transform:capitalize}
.status-actions{display:flex;gap:6px;flex-wrap:wrap}

/* conteudo */
.trends{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:12px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.trend{background:var(--surface-c-lowest);border-radius:var(--r-lg);padding:16px;box-shadow:var(--e1);display:flex;flex-direction:column;gap:8px}
.trend .hook{font-weight:600}
.creators{display:flex;gap:10px;overflow-x:auto;padding:4px 0 8px}
.creator{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;cursor:pointer;border:none;background:none;color:inherit}
.creator .av{position:relative;width:60px;height:60px;border-radius:30px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--secondary-container);color:var(--on-secondary-container);outline:2px solid transparent;outline-offset:2px}
.creator.on .av{outline-color:var(--primary)}
.creator .h{font-size:12px;max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.post{background:var(--surface-c-lowest);border-radius:var(--r-lg);box-shadow:var(--e1);overflow:hidden;display:flex;flex-direction:column}
.post .thumb{aspect-ratio:4/3;background:var(--surface-c-high);display:grid;place-items:center;color:var(--on-surface-variant);background-size:cover;background-position:center}
.post .thumb .ms{font-size:40px}
.post .body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.post .hook{font-weight:600}
.post .meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.post .act{display:flex;gap:6px;margin-top:auto;padding-top:6px}

/* dialog */
dialog{border:none;border-radius:var(--r-xl);background:var(--surface-c-high);color:var(--on-surface);padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 32px)}
dialog::backdrop{background:rgba(0,0,0,.32)}
dialog form{padding:24px}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.dact .sp{flex:1}
.snack{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--on-surface);color:var(--surface);padding:14px 18px;border-radius:4px;font-size:14px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
.snack.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:28px;font-size:12px;color:var(--on-surface-variant);text-align:center}

/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom));border-right:none;border-top:1px solid var(--outline-variant);background:var(--surface-c);z-index:40}
  .rail .logo,.rail .sp,.rail .logout{display:none}
  .nav{width:auto;flex:1;font-size:11px}
  .nav .pill{width:52px}
  .main{padding:16px 16px 130px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .dash{grid-template-columns:1fr}
  .grid2,.grid3{grid-template-columns:1fr}
  .fab{bottom:96px;right:16px}
  .display{font-size:24px}
  .monthsel strong{min-width:120px}
}
</style>
</head>
<body>

<div id="authView" class="auth hidden">
  <form class="card elev" id="authForm" style="border-radius:28px">
    <div class="brandmark"><div class="logo"><span class="ms fill">psychology</span></div><div><div class="title-l">Consultório</div><div class="muted small">Agenda, cobranças, recibos e conteúdo</div></div></div>
    <div id="nameField" class="field hidden"><label for="aName">Seu nome</label><input id="aName" autocomplete="name"></div>
    <div class="field"><label for="aEmail">E-mail</label><input id="aEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label for="aPass">Senha</label><input id="aPass" type="password" autocomplete="current-password" required minlength="8"></div>
    <button class="btn" id="authBtn" type="submit" style="width:100%;margin-top:22px">Entrar</button>
    <div id="authMsg" class="small" style="min-height:20px;margin-top:12px;color:var(--error)"></div>
    <div style="display:flex;justify-content:space-between;margin-top:4px">
      <button type="button" class="btn text sm" id="toggleAuth">Criar conta</button>
      <button type="button" class="btn text sm" id="forgot">Esqueci a senha</button>
    </div>
  </form>
</div>

<div id="appView" class="app hidden">
  <nav class="rail" id="rail">
    <div class="logo"><span class="ms fill">psychology</span></div>
    <button class="nav" data-view="inicio"><span class="pill"><span class="ms">space_dashboard</span></span>Início</button>
    <button class="nav" data-view="agenda"><span class="pill"><span class="ms">calendar_month</span></span>Agenda</button>
    <button class="nav" data-view="pacientes"><span class="pill"><span class="ms">group</span></span>Pacientes</button>
    <button class="nav" data-view="financeiro"><span class="pill"><span class="ms">payments</span></span>Financeiro</button>
    <button class="nav" data-view="recibos"><span class="pill"><span class="ms">receipt_long</span></span>Recibos</button>
    <button class="nav" data-view="conteudo"><span class="pill"><span class="ms">auto_awesome</span></span>Conteúdo</button>
    <div class="sp"></div>
    <button class="icon-btn logout" id="railProfile" title="Meu perfil"><span class="ms">account_circle</span></button>
    <button class="icon-btn logout" id="logout" title="Sair"><span class="ms">logout</span></button>
  </nav>
  <main class="main"><div class="wrap" id="view"></div></main>
</div>

<button class="fab hidden" id="fab"><span class="ms">add</span><span id="fabLabel">Novo</span></button>

<!-- dialogs -->
<dialog id="dlgPatient"><form id="fPatient">
  <div class="title-l" id="pTitle">Paciente</div>
  <div class="field"><label>Nome</label><input name="name" required maxlength="120"></div>
  <div class="grid3">
    <div class="field"><label>Situação</label><select name="status"><option value="ativo">Ativo</option><option value="pausa">Pausa</option><option value="alta">Alta</option></select></div>
    <div class="field"><label>Valor da sessão (R$)</label><input name="session_price" type="number" step="0.01" min="0" required></div>
    <div class="field"><label>Atendimento</label><select name="modality"><option value="presencial">Presencial</option><option value="online">Online</option></select></div>
  </div>
  <div class="grid3">
    <div class="field"><label>Dia fixo</label><select name="weekday"><option value="">Sem dia fixo</option><option value="1">Segunda</option><option value="2">Terça</option><option value="3">Quarta</option><option value="4">Quinta</option><option value="5">Sexta</option><option value="6">Sábado</option></select></div>
    <div class="field"><label>Horário</label><input name="session_time" type="time"></div>
    <div class="field"><label>Frequência</label><select name="frequency"><option value="semanal">Semanal</option><option value="quinzenal">Quinzenal</option><option value="mensal">Mensal</option></select></div>
  </div>
  <div class="grid3">
    <div class="field"><label>Modalidade de pagamento</label><select name="billing"><option value="por_sessao">Por sessão</option><option value="quinzenal">Quinzenal</option><option value="quinzenal_retroativo">Quinzenal retroativo</option><option value="mensal">Mensal</option><option value="mensal_retroativo">Mensal retroativo</option></select></div>
    <div class="field"><label>% cobrado na falta</label><input name="no_show_pct" type="number" min="0" max="100"></div>
    <div class="field"><label>% no cancelamento</label><input name="cancel_pct" type="number" min="0" max="100"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>CPF do paciente</label><input name="patient_cpf" inputmode="numeric" maxlength="14"></div>
    <div class="field"><label>Início</label><input name="start_date" type="date"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>Quem paga (se não for o paciente)</label><input name="payer_name"></div>
    <div class="field"><label>CPF de quem paga</label><input name="payer_cpf" inputmode="numeric" maxlength="14"></div>
  </div>
  <div class="grid2">
    <div class="field"><label>Responsável (se menor)</label><input name="guardian"></div>
    <div class="field"><label>WhatsApp</label><input name="whatsapp" inputmode="tel"></div>
  </div>
  <div class="field"><label>Observações administrativas (nada clínico)</label><textarea name="admin_notes" rows="2"></textarea></div>
  <div class="dact"><button type="button" class="btn danger" id="pDel">Excluir</button><div class="sp"></div><button type="button" class="btn text" data-close>Cancelar</button><button class="btn">Salvar</button></div>
</form></dialog>

<dialog id="dlgSession"><form id="fSession">
  <div class="title-l" id="sTitle">Sessão</div>
  <div class="field"><label>Paciente</label><select name="patient_id" required></select></div>
  <div class="grid2">
    <div class="field"><label>Data</label><input name="date" type="date" required></div>
    <div class="field"><label>Horário</label><input name="time" type="time"></div>
  </div>
  <div class="field"><label>Status</label><select name="status">
    <option value="agendada">Agendada</option><option value="realizada">Realizada</option><option value="falta">Falta</option><option value="cancelada_paciente">Cancelada pelo paciente</option><option value="cancelada_profissional">Cancelada por mim</option><option value="remarcada">Remarcada</option></select></div>
  <div class="grid3">
    <div class="field"><label>Pago?</label><select name="paid"><option value="false">Não</option><option value="true">Sim</option></select></div>
    <div class="field"><label>Data do pagamento</label><input name="paid_at" type="date"></div>
    <div class="field"><label>Forma</label><select name="method"><option value="">—</option><option>Pix</option><option>Dinheiro</option><option>Cartão</option><option>Transferência</option></select></div>
  </div>
  <div class="field"><label>Recibo emitido no Receita Saúde?</label><select name="receipt_issued"><option value="false">Não</option><option value="true">Sim</option></select></div>
  <div class="small muted" id="sCalc" style="margin-top:10px"></div>
  <div class="dact"><button type="button" class="btn danger" id="sDel">Excluir</button><div class="sp"></div><button type="button" class="btn text" data-close>Cancelar</button><button class="btn">Salvar</button></div>
</form></dialog>

<script src="/gestor/vendor/supabase.js"></script>
<script>
(() => {
'use strict';
const CFG = window.CONSULTORIO_CFG || { url: 'https://xalgykbgpyorqxlmsyvg.supabase.co', key: 'sb_publishable_J6KozLvwxa0-iiK_EqXNFw_-TxJmwbV' };
const sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } });
const HOME = location.origin + '/consultorio/';

const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = n => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const fom = d => new Date(d.getFullYear(), d.getMonth(), 1);
const addM = (d, n) => new Date(d.getFullYear(), d.getMonth() + n, 1);
const eom = d => new Date(d.getFullYear(), d.getMonth() + 1, 0);
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const monthName = d => cap(d.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
const fmtDate = s => s ? parse(s).toLocaleDateString('pt-BR') : '';
const initials = n => (n || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0]).join('').toUpperCase();
function snack(m) { const s = $('#snack'); s.textContent = m; s.classList.add('on'); clearTimeout(s._t); s._t = setTimeout(() => s.classList.remove('on'), 2600); }
function fail(e) { console.error(e); snack('Erro: ' + (e?.message || e)); }

const STATUS = { agendada: 'Agendada', realizada: 'Realizada', falta: 'Falta', cancelada_paciente: 'Cancelada pelo paciente', cancelada_profissional: 'Cancelada por mim', remarcada: 'Remarcada' };
const STATUS_BADGE = { agendada: 'b-neutral', realizada: 'b-ok', falta: 'b-err', cancelada_paciente: 'b-warn', cancelada_profissional: 'b-neutral', remarcada: 'b-info' };
const BILLING = { por_sessao: 'Por sessão', quinzenal: 'Quinzenal', quinzenal_retroativo: 'Quinzenal retroativo', mensal: 'Mensal', mensal_retroativo: 'Mensal retroativo' };
const WD = ['', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado', 'Domingo'];
const NET_IC = { instagram: 'photo_camera', tiktok: 'music_note', youtube: 'smart_display' };

const S = { user: null, profile: null, view: 'inicio', month: fom(new Date()), patients: [], sessions: [], allOpen: [], finFilter: 'todos', creators: [], posts: [], trends: [], creatorFilter: null, postStatus: 'todos', started: false };

/* ---------- regras ---------- */
function chargePct(p, status) {
  if (status === 'realizada' || status === 'agendada') return 1;
  if (status === 'falta') return (p?.no_show_pct ?? 100) / 100;
  if (status === 'cancelada_paciente') return (p?.cancel_pct ?? 0) / 100;
  return 0;
}
function dueDate(p, dateStr) {
  const d = parse(dateStr), y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  switch (p?.billing) {
    case 'quinzenal': return iso(new Date(y, m, day <= 15 ? 1 : 16));
    case 'quinzenal_retroativo': return iso(day <= 15 ? new Date(y, m, 16) : new Date(y, m + 1, 1));
    case 'mensal': return iso(new Date(y, m, 1));
    case 'mensal_retroativo': return iso(new Date(y, m + 1, 1));
    default: return dateStr;
  }
}
function situation(s) {
  if (!(Number(s.amount) > 0)) return 'sem';
  if (s.paid) return 'pago';
  if (s.due_date && s.due_date < todayISO()) return 'atrasado';
  return 'areceber';
}
const SIT = { pago: ['Pago', 'b-ok'], atrasado: ['Em atraso', 'b-err'], areceber: ['A receber', 'b-info'], sem: ['Sem cobrança', 'b-neutral'] };
const pById = id => S.patients.find(p => p.id === id);

/* ---------- auth ---------- */
let signup = false;
$('#toggleAuth').onclick = () => {
  signup = !signup;
  $('#nameField').classList.toggle('hidden', !signup);
  $('#authBtn').textContent = signup ? 'Criar conta' : 'Entrar';
  $('#toggleAuth').textContent = signup ? 'Já tenho conta' : 'Criar conta';
  $('#aPass').autocomplete = signup ? 'new-password' : 'current-password';
  $('#authMsg').textContent = '';
};
$('#forgot').onclick = async () => {
  const email = $('#aEmail').value.trim();
  if (!email) { $('#authMsg').textContent = 'Digite seu e-mail primeiro.'; return; }
  await sb.auth.resetPasswordForEmail(email, { redirectTo: HOME });
  $('#authMsg').style.color = 'var(--primary)'; $('#authMsg').textContent = 'Se houver conta, enviamos um link para trocar a senha.';
};
$('#authForm').onsubmit = async e => {
  e.preventDefault(); const msg = $('#authMsg'); msg.style.color = 'var(--error)'; msg.textContent = '';
  const email = $('#aEmail').value.trim(), password = $('#aPass').value;
  if (signup) {
    const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: HOME, data: { name: $('#aName').value.trim() } } });
    if (error) { msg.textContent = error.message; return; }
    if (data.session) return start(data.user);
    msg.style.color = 'var(--primary)'; msg.textContent = 'Conta criada. Confirme pelo link que enviamos ao seu e-mail.'; return;
  }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = /confirm/i.test(error.message) ? 'Confirme seu e-mail antes de entrar.' : 'E-mail ou senha incorretos.'; return; }
  start(data.user);
};
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

async function boot() {
  const { data: { session } } = await sb.auth.getSession();
  if (session) start(session.user); else $('#authView').classList.remove('hidden');
  sb.auth.onAuthStateChange(async (ev, s) => {
    if (ev === 'PASSWORD_RECOVERY') { const np = prompt('Nova senha (mínimo 8 caracteres):'); if (np && np.length >= 8) { const { error } = await sb.auth.updateUser({ password: np }); snack(error ? 'Não foi possível trocar a senha' : 'Senha atualizada'); } }
    if (ev === 'SIGNED_IN' && s) start(s.user);
  });
}
async function start(user) {
  if (S.started) return; S.started = true; S.user = user;
  $('#authView').classList.add('hidden'); $('#appView').classList.remove('hidden');
  const { data } = await sb.from('profiles').select('*').eq('id', user.id).maybeSingle(); S.profile = data;
  let v = null; try { v = localStorage.getItem('cons.view'); } catch (_) {}
  go(location.hash.slice(1) || v || 'inicio');
}
window.addEventListener('hashchange', () => { const v = location.hash.slice(1); if (v && v !== S.view && S.started) go(v, true); });

/* ---------- navegação ---------- */
const VIEWS = { inicio: viewInicio, agenda: viewAgenda, pacientes: viewPacientes, financeiro: viewFinanceiro, recibos: viewRecibos, conteudo: viewConteudo };
$$('.nav').forEach(b => b.onclick = () => go(b.dataset.view));
async function go(v, fromHash) {
  if (!VIEWS[v]) v = 'inicio';
  S.view = v; try { localStorage.setItem('cons.view', v); } catch (_) {}
  if (!fromHash) history.replaceState(null, '', '#' + v);
  $$('.nav').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  const fab = $('#fab'); fab.classList.add('hidden');
  window.scrollTo(0, 0);
  try { await VIEWS[v](); } catch (e) { fail(e); }
}
function setFab(label, fn) { const f = $('#fab'); $('#fabLabel').textContent = label; f.onclick = fn; f.classList.remove('hidden'); }
function monthSel() { return `<div class="monthsel"><button class="icon-btn" id="mPrev" aria-label="Mês anterior"><span class="ms">chevron_left</span></button><strong>${monthName(S.month)}</strong><button class="icon-btn" id="mNext" aria-label="Próximo mês"><span class="ms">chevron_right</span></button></div>`; }
function bindMonth() { $('#mPrev').onclick = () => { S.month = addM(S.month, -1); go(S.view); }; $('#mNext').onclick = () => { S.month = addM(S.month, 1); go(S.view); }; }

/* ---------- dados ---------- */
async function loadPatients() { const { data, error } = await sb.from('patients').select('*').order('name'); if (error) throw error; S.patients = data; }
async function loadMonth() {
  const a = iso(S.month), b = iso(eom(S.month));
  const [m, open] = await Promise.all([
    sb.from('sessions').select('*').gte('date', a).lte('date', b).order('date').order('time'),
    sb.from('sessions').select('*').eq('paid', false).gt('amount', 0).lt('due_date', todayISO())
  ]);
  if (m.error) throw m.error; if (open.error) throw open.error;
  S.sessions = m.data; S.allOpen = open.data;
}
async function loadPaidInMonth() {
  const { data, error } = await sb.from('sessions').select('*').eq('paid', true).gte('paid_at', iso(S.month)).lte('paid_at', iso(eom(S.month)));
  if (error) throw error; return data;
}
function metrics(paidInMonth) {
  const done = S.sessions.filter(s => s.status !== 'agendada');
  return {
    realizadas: S.sessions.filter(s => s.status === 'realizada').length,
    faltas: S.sessions.filter(s => s.status === 'falta').length,
    gerado: done.reduce((a, s) => a + Number(s.amount), 0),
    recebido: paidInMonth.reduce((a, s) => a + Number(s.amount), 0),
    areceber: S.sessions.filter(s => situation(s) === 'areceber').reduce((a, s) => a + Number(s.amount), 0),
    atraso: S.allOpen.reduce((a, s) => a + Number(s.amount), 0),
    previsto: S.sessions.filter(s => s.status === 'agendada').reduce((a, s) => a + Number(s.amount), 0)
  };
}
function alerts() {
  const out = [], today = new Date();
  for (const p of S.patients.filter(p => p.status === 'ativo')) {
    const mine = S.allSessions?.filter(s => s.patient_id === p.id) || [];
    const atraso = S.allOpen.filter(s => s.patient_id === p.id).reduce((a, s) => a + Number(s.amount), 0);
    if (atraso > 0) out.push([p, 'Pagamento em atraso: ' + brl(atraso), 'b-err']);
    const last2 = mine.filter(s => s.status !== 'agendada').sort((a, b) => b.date.localeCompare(a.date)).slice(0, 2);
    if (last2.length === 2 && last2.every(s => s.status === 'falta')) out.push([p, 'Faltou 2 vezes seguidas', 'b-warn']);
    const lastDone = mine.filter(s => s.status === 'realizada').map(s => s.date).sort().pop();
    if (lastDone) { const days = Math.floor((today - parse(lastDone)) / 864e5); if (days > 21) out.push([p, `Sem sessão há ${days} dias`, 'b-info']); }
  }
  return out;
}

/* ---------- INÍCIO ---------- */
async function viewInicio() {
  await loadPatients(); await loadMonth();
  const paid = await loadPaidInMonth();
  const since = iso(new Date(Date.now() - 60 * 864e5));
  const { data: recent } = await sb.from('sessions').select('patient_id,date,status').gte('date', since).lte('date', todayISO());
  S.allSessions = recent || [];
  const M = metrics(paid), al = alerts();
  const name = (S.profile?.name || S.user.email.split('@')[0]).split(' ')[0];
  const today = S.sessions.filter(s => s.date === todayISO());
  $('#view').innerHTML = `
  <div class="topbar"><div><div class="display">Olá, ${esc(name)}</div><div class="muted">Resumo de ${monthName(S.month).toLowerCase()}</div></div><div class="sp"></div>${monthSel()}<button class="avatar" id="topProfile" title="Meu perfil" style="border:none;cursor:pointer;background:var(--primary);color:var(--on-primary)">${esc(initials(S.profile?.name || S.user.email))}</button></div>
  <div class="kpis"></div>`;
  $('.kpis').innerHTML = [
    kpi('event_available', 'var(--primary-container)', M.realizadas, 'Sessões realizadas', 'agenda'),
    kpi('event_busy', 'var(--error-container)', M.faltas, 'Faltas no mês', 'agenda'),
    kpi('account_balance_wallet', 'var(--secondary-container)', brl(M.recebido), 'Recebido no mês', 'financeiro:pago'),
    kpi('receipt_long', 'var(--tertiary-container)', (await pendingReceipts()).length, 'Recibos a emitir', 'recibos')
  ].join('');
  const bars = [
    { k: 'gerado', l: 'Gerado', v: M.gerado, c: 'var(--chart-1)', to: 'financeiro:todos' },
    { k: 'recebido', l: 'Recebido', v: M.recebido, c: 'var(--chart-2)', to: 'financeiro:pago' },
    { k: 'areceber', l: 'A receber', v: M.areceber, c: 'var(--chart-3)', to: 'financeiro:areceber' },
    { k: 'atraso', l: 'Em atraso', v: M.atraso, c: 'var(--chart-4)', to: 'financeiro:atrasado' }
  ];
  $('#view').insertAdjacentHTML('beforeend', `
  <div class="dash">
    <section class="card elev chart">
      <div class="cardhead"><div><div class="title-m">Financeiro do mês</div><div class="small muted">Toque numa coluna para ver os lançamentos</div></div><span class="badge b-neutral">Previsto: ${brl(M.previsto)}</span></div>
      ${barChart(bars)}
      <div class="legend">${bars.map(b => `<span><i style="background:${b.c}"></i>${b.l}</span>`).join('')}</div>
    </section>
    <section class="card elev">
      <div class="cardhead"><div class="title-m">Alertas</div><span class="badge ${al.length ? 'b-warn' : 'b-ok'}">${al.length}</span></div>
      <div class="list">${al.length ? al.map(([p, t, b]) => `<div class="row click" data-pat="${p.id}"><div class="avatar">${esc(initials(p.name))}</div><div class="grow"><div class="t">${esc(p.name)}</div><span class="badge ${b}">${esc(t)}</span></div><span class="ms muted">chevron_right</span></div>`).join('') : `<div class="empty"><span class="ms">verified</span>Nenhum alerta. Tudo em dia.</div>`}</div>
    </section>
  </div>
  <section class="card elev" style="margin-top:16px">
    <div class="cardhead"><div class="title-m">Hoje</div><button class="btn text sm" data-go="agenda">Ver agenda</button></div>
    <div class="list">${today.length ? today.map(sessionRow).join('') : `<div class="empty"><span class="ms">wb_sunny</span>Nenhuma sessão hoje.</div>`}</div>
  </section>
  <div class="foot">Não registre informações clínicas aqui. Este sistema é administrativo.</div>`);
  bindMonth();
  $('#topProfile').onclick = openProfile;
  $$('[data-to]').forEach(el => el.onclick = () => jump(el.dataset.to));
  $$('[data-go]').forEach(el => el.onclick = () => go(el.dataset.go));
  $$('[data-pat]').forEach(el => el.onclick = () => openPatient(pById(el.dataset.pat)));
  bindSessionRows();
  setFab('Sessão', () => openSession());
}
function kpi(ic, bg, v, l, to) { return `<button class="kpi" data-to="${to}"><div class="k-ic" style="background:${bg}"><span class="ms">${ic}</span></div><div class="v">${v}</div><div class="l">${l}</div></button>`; }
function jump(to) { const [v, f] = to.split(':'); if (f) S.finFilter = f; go(v); }
function barChart(bars) {
  const W = innerWidth < 600 ? 340 : 560, H = innerWidth < 600 ? 230 : 260, pad = innerWidth < 600 ? 8 : 36, base = H - 34, max = Math.max(1, ...bars.map(b => b.v)) * 1.15;
  const bw = (W - pad * 2) / bars.length;
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = base - (base - 16) * i / 4; g += `<line x1="${pad}" x2="${W - 8}" y1="${y}" y2="${y}" stroke="var(--outline-variant)" stroke-width="1" ${i ? 'stroke-dasharray="2 4"' : ''}/>`; }
  bars.forEach((b, i) => {
    const h = (base - 16) * b.v / max, x = pad + i * bw + bw * .2, w = bw * .6, y = base - h;
    g += `<g class="bar" data-to="${b.to}" role="button" tabindex="0" aria-label="${b.l}: ${brl(b.v)}"><rect x="${x}" y="${y}" width="${w}" height="${Math.max(h, 2)}" rx="8" fill="${b.c}"/><rect x="${pad + i * bw}" y="16" width="${bw}" height="${base - 16}" fill="transparent"/>
      <text class="val" x="${x + w / 2}" y="${y - 8}" text-anchor="middle">${brl(b.v).replace(',00', '')}</text>
      <text x="${x + w / 2}" y="${base + 20}" text-anchor="middle">${b.l}</text></g>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico financeiro do mês">${g}</svg>`;
}

/* ---------- AGENDA ---------- */
async function viewAgenda() {
  await loadPatients(); await loadMonth();
  const byDay = {}; S.sessions.forEach(s => (byDay[s.date] = byDay[s.date] || []).push(s));
  const days = Object.keys(byDay).sort();
  $('#view').innerHTML = `
  <div class="topbar"><div class="display">Agenda</div><div class="sp"></div>${monthSel()}<button class="btn tonal" id="gen"><span class="ms">event_repeat</span>Gerar sessões do mês</button></div>
  <section class="card elev"><div class="list">${days.length ? days.map(d => `<div class="dayhead">${parse(d).toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'short' })}</div>` + byDay[d].map(sessionRow).join('')).join('') : `<div class="empty"><span class="ms">event</span>Nenhuma sessão em ${monthName(S.month).toLowerCase()}. Use “Gerar sessões do mês” para criar a agenda a partir dos horários fixos dos pacientes.</div>`}</div></section>`;
  bindMonth(); bindSessionRows();
  $('#gen').onclick = generateMonth;
  setFab('Sessão', () => openSession());
}
function sessionRow(s) {
  const p = pById(s.patient_id), sit = situation(s);
  return `<div class="row click" data-sess="${s.id}"><div class="avatar">${esc(initials(p?.name))}</div>
    <div class="grow"><div class="t">${esc(p?.name || 'Paciente')}</div><div class="s">${s.time ? s.time.slice(0, 5) + ' · ' : ''}${p?.modality === 'online' ? 'Online' : 'Presencial'}</div></div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px"><span class="badge ${STATUS_BADGE[s.status]}">${STATUS[s.status]}</span>${Number(s.amount) > 0 ? `<span class="small"><span class="num">${brl(s.amount)}</span> · ${SIT[sit][0]}</span>` : ''}</div></div>`;
}
function bindSessionRows() { $$('[data-sess]').forEach(el => el.onclick = () => openSession(S.sessions.find(s => s.id === el.dataset.sess) || S.finList?.find(s => s.id === el.dataset.sess))); }
async function generateMonth() {
  const act = S.patients.filter(p => p.status === 'ativo' && p.weekday);
  if (!act.length) return snack('Cadastre pacientes ativos com dia fixo primeiro.');
  const existing = new Set(S.sessions.map(s => s.patient_id + s.date));
  const rows = [], first = S.month, last = eom(S.month);
  for (const p of act) {
    const jsWd = p.weekday % 7; // 1..6 -> seg..sáb, 7 -> domingo(0)
    const dates = [];
    for (let d = new Date(first); d <= last; d.setDate(d.getDate() + 1)) if (d.getDay() === jsWd) dates.push(new Date(d));
    let pick = dates;
    if (p.frequency === 'mensal') pick = dates.slice(0, 1);
    if (p.frequency === 'quinzenal') {
      const ref = p.start_date ? parse(p.start_date) : dates[0];
      pick = dates.filter(d => Math.round((d - ref) / 864e5 / 7) % 2 === 0);
    }
    for (const d of pick) {
      const ds = iso(d); if (existing.has(p.id + ds)) continue;
      if (p.start_date && ds < p.start_date) continue;
      rows.push({ patient_id: p.id, date: ds, time: p.session_time, status: 'agendada', amount: Number(p.session_price), due_date: dueDate(p, ds) });
    }
  }
  if (!rows.length) return snack('A agenda do mês já está completa.');
  const { error } = await sb.from('sessions').insert(rows); if (error) return fail(error);
  snack(rows.length + ' sessões criadas'); go('agenda');
}

  if (x) { f.url.value = x.url || ''; f.creator_id.value = x.creator_id || ''; f.format.value = x.format || 'Reels'; f.hook.value = x.hook || ''; f.why.value = x.why || ''; f.adaptation.value = x.adaptation || ''; f.status.value = x.status || 'ideia'; }
  else if (S.creatorFilter) f.creator_id.value = S.creatorFilter;
  $('#poDel').classList.toggle('hidden', !editingPost); $('#dlgPost').showModal();
}
$('#fPost').onsubmit = async e => { e.preventDefault(); const f = e.target; const cr = S.creators.find(c => c.id === f.creator_id.value);
  const row = { url: f.url.value.trim() || null, creator_id: f.creator_id.value || null, network: cr?.network || (/tiktok/.test(f.url.value) ? 'tiktok' : /youtu/.test(f.url.value) ? 'youtube' : 'instagram'), format: f.format.value, hook: f.hook.value || null, why: f.why.value || null, adaptation: f.adaptation.value || null, status: f.status.value };
  const { error } = editingPost ? await sb.from('swipe_posts').update(row).eq('id', editingPost.id) : await sb.from('swipe_posts').insert(row);
  if (error) return fail(/duplicate|unique/i.test(error.message) ? new Error('Esse post já está no swipe file') : error); $('#dlgPost').close(); snack('Salvo no swipe file'); go('conteudo'); };
$('#poDel').onclick = async () => { if (!editingPost || !confirm('Excluir este post do swipe file?')) return; const { error } = await sb.from('swipe_posts').delete().eq('id', editingPost.id); if (error) return fail(error); $('#dlgPost').close(); go('conteudo'); };
$('#fTrend').onsubmit = async e => { e.preventDefault(); const f = e.target; const { error } = await sb.from('trends').insert({ topic: f.topic.value, angle: f.angle.value || null, hook: f.hook.value || null, source_name: f.source_name.value || null, source_url: f.source_url.value || null, owner: S.user.id }); if (error) return fail(error); $('#dlgTrend').close(); go('conteudo'); };

/* ---------- PERFIL ---------- */
function openProfile() {
  const f = $('#fProfile'), p = S.profile || {}; f.reset();
  $('#profEmail').textContent = S.user.email;
  f.name.value = p.name || ''; f.crp.value = p.crp || ''; f.session_minutes.value = p.session_minutes ?? 50;
  f.no_show_pct.value = p.no_show_pct ?? 100; f.cancel_pct.value = p.cancel_pct ?? 0;
  $('#dlgProfile').showModal();
}
$('#railProfile').onclick = openProfile;
$('#profLogout').onclick = async () => { await sb.auth.signOut(); location.reload(); };
$('#fProfile').onsubmit = async e => {
  e.preventDefault(); const f = e.target;
  const row = { id: S.user.id, name: f.name.value.trim() || null, crp: f.crp.value.trim() || null, session_minutes: Number(f.session_minutes.value || 50), no_show_pct: Number(f.no_show_pct.value || 0), cancel_pct: Number(f.cancel_pct.value || 0) };
  const { data, error } = await sb.from('profiles').upsert(row).select().maybeSingle(); if (error) return fail(error);
  S.profile = data || row;
  if (f.password.value) { const r = await sb.auth.updateUser({ password: f.password.value }); if (r.error) return fail(r.error); }
  $('#dlgProfile').close(); snack('Perfil salvo'); go(S.view);
};

$$('[data-close]').forEach(b => b.onclick = () => b.closest('dialog').close());
boot();
})();
</script>
