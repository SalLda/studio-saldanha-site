<style>
/* Layout: cabeçalho com a data grande, grade de fotos em colunas, botão de baixar em cada foto, rodapé com chamada de orçamento.
   Identidade do site omatsaldanha: base escura, âmbar, verde musgo, Fraunces + Space Grotesk. */
:root {
  --bg: #1c1c1c;
  --surface: #262625;
  --line: #3a3a37;
  --fg: #f4f1ea;
  --muted: #a9a79f;
  --amber: #f0b429;
  --on-amber: #1c1c1c;
  --moss: #7a9b7e;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f6f3ea; --surface: #ffffff; --line: #dcd8cb; --fg: #1c1c1c; --muted: #5f5d56;
    --amber: #c98a00; --on-amber: #ffffff; --moss: #4f7355; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f6f3ea; --surface: #ffffff; --line: #dcd8cb; --fg: #1c1c1c; --muted: #5f5d56;
  --amber: #c98a00; --on-amber: #ffffff; --moss: #4f7355; color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 28px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
header { display: flex; flex-direction: column; gap: 10px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--moss); font-weight: 500; }
h1 { font-family: var(--display); font-weight: 700; font-size: clamp(44px, 12vw, 84px); line-height: .98; margin: 0; letter-spacing: -.02em; text-wrap: balance; }
h1 span { color: var(--amber); }
.lead { color: var(--muted); max-width: 52ch; margin: 0; }
.lead b { color: var(--fg); font-weight: 500; }


.bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; border-block: 1px solid var(--line); padding-block: 12px; }
.bar .count { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; font: 700 15px var(--body); text-decoration: none; cursor: pointer; border: 1.5px solid var(--amber); color: var(--amber); background: transparent; }
.btn.solid { background: var(--amber); color: var(--on-amber); }
.btn:hover { filter: brightness(1.08); }
.btn:focus-visible, .tile a:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }

.grid { columns: 2; column-gap: 12px; }
@media (min-width: 640px) { .grid { columns: 3; column-gap: 16px; } }
@media (min-width: 900px) { .grid { columns: 4; } }
.tile { break-inside: avoid; margin: 0 0 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
@media (min-width: 640px) { .tile { margin-bottom: 16px; } }
.tile img { display: block; width: 100%; height: auto; background: var(--line); }
.tile .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; }
.tile .num { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; letter-spacing: .04em; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .dl { font-weight: 700; font-size: 14px; color: var(--on-amber); background: var(--amber); text-decoration: none; padding: 8px 14px; border-radius: 999px; min-height: 36px; display: inline-flex; align-items: center; }

footer { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 28px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
footer h2 { font-family: var(--display); font-weight: 700; font-size: clamp(26px, 6vw, 38px); line-height: 1.1; margin: 0; text-wrap: balance; }
footer p { margin: 0; color: var(--muted); }
footer .tel { color: var(--fg); font-variant-numeric: tabular-nums; font-weight: 500; user-select: all; }
.handle { color: var(--muted); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .btn { transition: filter .15s; } }


.tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; position: sticky; top: 0; z-index: 5; background: var(--bg); padding-block: 10px; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); font: 700 15px var(--body); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.tab small { font-weight: 500; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tab[aria-selected="true"] { background: var(--amber); border-color: var(--amber); color: var(--on-amber); }
.tab[aria-selected="true"] small { color: var(--on-amber); opacity: .8; }
.tab:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
.promo { border: 1px solid var(--amber); border-radius: 12px; background: var(--surface); padding: 18px 18px 16px; display: flex; flex-direction: column; align-items: flex-start; gap: 14px; }
.promo h2 { font-family: var(--display); font-weight: 700; font-size: clamp(22px, 5.4vw, 30px); line-height: 1.15; margin: 0; text-wrap: balance; }
.panel { display: flex; flex-direction: column; gap: 24px; }
</style>
