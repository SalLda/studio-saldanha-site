<style>

}

  --error:#FFB4AB;--error-container:#93000A;--on-error-container:#FFDAD6;
  --warn:#FFB95F;--warn-container:#693C00;--ok:#8FD9A3;--ok-container:#0A4A24;
  --surface:#131316;--surface-c-lowest:#0E0E11;--surface-c-low:#1B1B1F;--surface-c:#1F1F23;--surface-c-high:#2A2A2D;--surface-c-highest:#353538;--dlg:#2A2A2D;

*{box-sizing:border-box}

.weekdays{display:flex;gap:6px;flex-wrap:wrap}
.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:15px;border:3px solid transparent;cursor:pointer;background:var(--c)}.sw.on{border-color:var(--on-surface)}
dialog{border:0;border-radius:28px;padding:0;background:var(--dlg);color:var(--on-surface);width:min(560px,calc(100vw - 24px));max-height:92vh;box-shadow:var(--e3)}dialog::backdrop{background:rgba(0,0,0,.45)}

.prev{max-height:280px;overflow:auto;border:1px solid var(--outline-variant);border-radius:12px;margin-top:10px}.prev .pr{display:grid;grid-template-columns:28px 128px 112px 1fr;gap:8px;align-items:center;padding:6px 8px;border-bottom:1px solid var(--outline-variant);font-size:13px}.prev .pr:last-child{border-bottom:0}.prev input[type=date],.prev select,.prev input[type=text]{height:34px;border:1px solid var(--outline-variant);border-radius:8px;background:transparent;padding:0 8px;width:100%;min-width:0}
@media (max-width:640px){.prev .pr{grid-template-columns:24px 1fr 1fr}.prev .pr .tt{grid-column:1/-1}}
.snack{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--on-surface);color:var(--surface);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:100;max-width:90vw;font-size:14px}.snack.show{opacity:1;transform:translateX(-50%)}
.al-grid{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:16px;align-items:start}@media (max-width:900px){.al-grid{grid-template-columns:1fr}}
.al-res{background:var(--surface-c-lowest);border-radius:var(--r-md);box-shadow:var(--e1);padding:14px;margin-bottom:10px}.al-res h4{font-size:15px;margin:6px 0 4px;font-weight:600}.al-res .m{font-size:12.5px;color:var(--on-surface-variant)}.al-res details{margin-top:6px;font-size:13px}

</style>

<script>
(() => {
'use strict';
const CFG = window.ESTUDAPSI_CFG || { url: 'https://xalgykbgpyorqxlmsyvg.supabase.co', key: 'sb_publishable_J6KozLvwxa0-iiK_EqXNFw_-TxJmwbV' };
const sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: true, autoRefreshToken: true } });
const HOME = location.origin + '/estudapsi/';
const $ = (s, el = document) => el.querySelector(s), $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const DOW = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'], DOWL = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
const fmtD = s => { const d = parse(s); return DOW[d.getDay()] + ', ' + pad(d.getDate()) + '/' + pad(d.getMonth() + 1); };
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
let snT; const snack = m => { const e = $('#snack'); e.textContent = m; e.classList.add('show'); clearTimeout(snT); snT = setTimeout(() => e.classList.remove('show'), 3200); };
const fail = e => { console.error(e); snack('Algo deu errado: ' + (e.message || e)); };
const COLORS = ['#4355B9', '#C2185B', '#00796B', '#E65100', '#6A1B9A', '#2E7D32', '#0277BD', '#AD7A00'];
const KIND = { aula: ['Aula', 'event'], entrega: ['Entrega', 'assignment'], prova: ['Prova', 'quiz'], leitura: ['Leitura', 'menu_book'] };

const S = { user: null, view: 'inicio', month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), sel: todayISO(), courses: [], events: [], books: [] };
const cById = id => S.courses.find(c => c.id === id);

/* ---------- auth ---------- */
let signup = false;
$('#toggleAuth').onclick = () => { signup = !signup; $('#nameField').classList.toggle('hidden', !signup); $('#authBtn').textContent = signup ? 'Criar conta' : 'Entrar'; $('#toggleAuth').textContent = signup ? 'Já tenho conta' : 'Criar conta'; $('#aPass').autocomplete = signup ? 'new-password' : 'current-password'; $('#authMsg').textContent = ''; };
$('#forgot').onclick = async () => { const email = $('#aEmail').value.trim(); if (!email) { $('#authMsg').textContent = 'Digite seu e-mail primeiro.'; return; } await sb.auth.resetPasswordForEmail(email, { redirectTo: HOME }); $('#authMsg').style.color = 'var(--primary)'; $('#authMsg').textContent = 'Se houver conta, enviamos um link para trocar a senha.'; };
$('#authForm').onsubmit = async e => {
  e.preventDefault(); const msg = $('#authMsg'); msg.style.color = 'var(--error)'; msg.textContent = '';
  const email = $('#aEmail').value.trim(), password = $('#aPass').value;
  if (signup) { const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: HOME, data: { name: $('#aName').value.trim() } } }); if (error) { msg.textContent = error.message; return; } if (data.session) return start(data.user); msg.style.color = 'var(--primary)'; msg.textContent = 'Conta criada. Confirme pelo link que enviamos ao seu e-mail.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { msg.textContent = /confirm/i.test(error.message) ? 'Confirme seu e-mail antes de entrar.' : 'E-mail ou senha incorretos.'; return; }
  start(data.user);
};
$('#logout').onclick = async () => { await sb.auth.signOut(); location.reload(); };

/* ---------- dados ---------- */
async function loadAll() {
  const [c, e, b] = await Promise.all([sb.from('est_courses').select('*').order('created_at'), sb.from('est_events').select('*').order('date').limit(3000), sb.from('est_books').select('*').order('created_at', { ascending: false })]);
  for (const r of [c, e, b]) if (r.error) throw r.error;
  S.courses = c.data; S.events = e.data; S.books = b.data;
}
async function go(v) {
  S.view = v || S.view; $$('#rail .nav[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view));
  try { await loadAll(); await VIEWS[S.view](); } catch (e) { $('#view').innerHTML = `<div class="notice warn"><span class="ms">warning</span><div>Não consegui carregar seus dados. ${/relation|does not exist|schema cache/i.test(e.message || '') ? 'As tabelas do Estudapsi ainda não foram criadas no banco.' : esc(e.message || '')}</div></div>`; console.error(e); }
  window.scrollTo(0, 0);
}
$$('#rail .nav[data-view]').forEach(b => b.onclick = () => go(b.dataset.view));
async function start(user) {
  S.user = user; $('#authView').classList.add('hidden'); $('#appView').classList.remove('hidden'); await go('inicio');
}

/* ---------- diálogos ---------- */
function modal(html, wide) {
  let d = $('#dlg'); if (d) d.remove(); d = document.createElement('dialog'); d.id = 'dlg'; if (wide) d.className = 'wide'; d.innerHTML = html; document.body.appendChild(d);
  d.addEventListener('click', e => { if (e.target === d) d.close(); }); $$('[data-close]', d).forEach(b => b.onclick = () => d.close()); d.showModal(); return d;
}

/* ---------- INÍCIO ---------- */

/* ---------- CALENDÁRIO ---------- */
async function viewCalendario() {
  const m = S.month, first = new Date(m.getFullYear(), m.getMonth(), 1), start = new Date(first); start.setDate(1 - first.getDay());
  const cells = []; for (let i = 0; i < 42; i++) { const d = new Date(start); d.setDate(start.getDate() + i); cells.push(d); }
  const by = {}; S.events.forEach(e => (by[e.date] = by[e.date] || []).push(e));
  const t = todayISO(), mn = m.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
  const selEv = (by[S.sel] || []).sort((a, b) => (a.kind === 'aula') - (b.kind === 'aula'));
  $('#view').innerHTML = `<div class="topbar"><div class="display">Calendário</div><div class="sp"></div><div class="monthsel"><button class="icon-btn" id="pm" aria-label="Mês anterior"><span class="ms">chevron_left</span></button><strong>${mn}</strong><button class="icon-btn" id="nm" aria-label="Próximo mês"><span class="ms">chevron_right</span></button></div><button class="btn tonal sm" id="goToday">Hoje</button><button class="btn sm" id="addEv"><span class="ms">add</span>Entrega ou prova</button></div>

    return `<button class="day ${d.getMonth() !== m.getMonth() ? 'out' : ''} ${k === t ? 'today' : ''} ${k === S.sel ? 'sel' : ''}" data-d="${k}"><span class="n">${d.getDate()}</span>${L.slice(0, 3).map(e => `<span class="ev ${e.kind === 'aula' ? 'aula' : ''} ${e.status === 'feito' ? 'done' : ''}" style="--c:${cById(e.course_id)?.color || COLORS[0]}">${esc(e.kind === 'aula' ? (cById(e.course_id)?.name || 'Aula') : (e.title || KIND[e.kind][0]))}</span>`).join('')}${L.length > 3 ? `<span class="more">+${L.length - 3}</span>` : ''}</button>`; }).join('')}</div>
  <section class="card elev" style="margin-top:14px"><div class="cardhead"><div class="title-m">${cap(fmtD(S.sel))}</div></div>${selEv.length ? selEv.map(e => evHtml(e)).join('') : '<div class="empty small">Nada neste dia.</div>'}</section>`;

  $('#addEv').onclick = () => openEvent(null, S.sel); bindDone();

/* ---------- CRONOGRAMA (colar, gerar, .ics) ---------- */
const classify = t => { const s = (t || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, ''); return /\b(prova|av\d?|avaliacao|exame|teste|p\d)\b|2a chamada|segunda chamada/.test(s) ? 'prova' : /entrega|trabalho|seminario|relatorio|resenha|artigo|prazo|atividade|portfolio|fichamento|projeto|postar|enviar/.test(s) ? 'entrega' : /leitura|ler\b|capitulo|cap\./.test(s) ? 'leitura' : 'aula'; };
function parseText(txt, c) {
  const yr = c?.term_start ? +c.term_start.slice(0, 4) : new Date().getFullYear(), out = [], topics = [];
  txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).forEach(l => {
    const m = l.match(/(\d{1,2})[\/.\-](\d{1,2})(?:[\/.\-](\d{2,4}))?/);
    if (m) { let y = m[3] ? +m[3] : yr; if (y < 100) y += 2000; const mo = +m[2], da = +m[1]; if (mo < 1 || mo > 12 || da < 1 || da > 31) { topics.push(l); return; }
      let title = (l.slice(0, m.index) + ' ' + l.slice(m.index + m[0].length)).replace(/^\s*(a|até|ao)\s+\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?/i, '').replace(/^[\s\-–—:|·.,]+|[\s\-–—:|·.,]+$/g, '').replace(/\s{2,}/g, ' ');
      out.push({ on: true, date: y + '-' + pad(mo) + '-' + pad(da), kind: classify(title || l), title: title || 'Aula' }); }
    else topics.push(l.replace(/^[\s\-–—•*\d.)]+/, '').trim());
  });
  return { dated: out, topics: topics.filter(Boolean) };
}
function classDates(c) { if (!c.term_start || !c.term_end || !(c.weekdays || []).length) return []; const r = []; for (let s = c.term_start; s <= c.term_end; s = addDays(s, 1)) if (c.weekdays.includes(parse(s).getDay())) r.push(s); return r; }
function parseICS(txt) {
  const un = txt.replace(/\r?\n[ \t]/g, ''), out = [];
  (un.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/g) || []).forEach(b => { const ds = b.match(/DTSTART[^:\n]*:(\d{4})(\d{2})(\d{2})/), su = b.match(/SUMMARY[^:\n]*:(.*)/); if (!ds) return; const title = (su ? su[1] : 'Evento').replace(/\\,/g, ',').replace(/\\n/g, ' ').trim(); out.push({ on: true, date: ds[1] + '-' + ds[2] + '-' + ds[3], kind: classify(title), title }); });
  return out;
}

  <div id="pPrev"></div></div>`, true);
  let tab = 'txt'; $$('.tab', d).forEach(b => b.onclick = () => { tab = b.dataset.t; $$('.tab', d).forEach(x => x.classList.toggle('on', x === b)); $('#pTxt', d).classList.toggle('hidden', tab !== 'txt'); $('#pGen', d).classList.toggle('hidden', tab !== 'gen'); $('#pIcs', d).classList.toggle('hidden', tab !== 'ics'); $('#pPrev', d).innerHTML = ''; });

    $('#pPrev', d).innerHTML = `<div class="small" style="margin-top:12px"><b>${rows.length}</b> itens para adicionar. Desmarque o que não quiser e corrija o que precisar.</div><div class="prev">${rows.map((r, i) => `<div class="pr"><input type="checkbox" data-i="${i}" ${r.on ? 'checked' : ''} aria-label="Incluir"><input type="date" data-f="date" data-i="${i}" value="${r.date}"><select data-f="kind" data-i="${i}">${Object.entries(KIND).map(([k, v]) => `<option value="${k}" ${r.kind === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select><input class="tt" type="text" data-f="title" data-i="${i}" value="${esc(r.title)}"></div>`).join('')}</div>

      if (!ins.length) { snack('Nada novo para adicionar'); d.close(); return; } for (let i = 0; i < ins.length; i += 200) { const { error } = await sb.from('est_events').insert(ins.slice(i, i + 200)); if (error) return fail(error); }

  };
  $('#doParse', d).onclick = () => { const { dated, topics } = parseText($('#sTxt', d).value, c); const rows = [...dated];
    if (topics.length && classDates(c).length) { const used = new Set(dated.filter(r => r.kind === 'aula').map(r => r.date)); const free = classDates(c).filter(x => !used.has(x)); topics.slice(0, free.length).forEach((t, i) => rows.push({ on: true, date: free[i], kind: classify(t) === 'aula' ? 'aula' : classify(t), title: t })); }

/* ===== AlicIA: pesquisa científica com estratégia booleana ===== */
const AL_TERMS = [['ansiedade generalizada', 'generalized anxiety disorder'], ['ansiedade social', 'social anxiety disorder'], ['ansiedade', 'anxiety'], ['depressão', 'depression'], ['depressao', 'depression'], ['pânico', 'panic disorder'], ['panico', 'panic disorder'],
  ['tept', 'posttraumatic stress disorder'], ['estresse pós-traumático', 'posttraumatic stress disorder'], ['trauma', 'trauma'], ['toc', 'obsessive-compulsive disorder'], ['obsessivo', 'obsessive-compulsive disorder'], ['tdah', 'ADHD'], ['atenção', 'attention deficit'], ['autismo', 'autism spectrum disorder'], ['tea', 'autism spectrum disorder'],
  ['luto', 'grief'], ['borderline', 'borderline personality disorder'], ['limítrofe', 'borderline personality disorder'], ['automutilação', 'self-harm'], ['suicid', 'suicidal ideation'], ['insônia', 'insomnia'], ['insonia', 'insomnia'], ['sono', 'sleep'], ['burnout', 'burnout'], ['estresse', 'stress'],
  ['autoestima', 'self-esteem'], ['perfeccionismo', 'perfectionism'], ['procrastinação', 'procrastination'], ['relacionamento', 'relationship difficulties'], ['conjugal', 'couple distress'], ['casal', 'couple therapy'], ['família', 'family'], ['familiar', 'family'], ['raiva', 'anger'], ['agressividade', 'aggression'],
  ['compulsão alimentar', 'binge eating disorder'], ['bulimia', 'bulimia nervosa'], ['anorexia', 'anorexia nervosa'], ['alimentar', 'eating disorder'], ['álcool', 'alcohol use disorder'], ['alcool', 'alcohol use disorder'], ['drogas', 'substance use disorder'], ['dependência', 'substance use disorder'], ['fobia', 'specific phobia'],
  ['bipolar', 'bipolar disorder'], ['psicose', 'psychosis'], ['esquizofrenia', 'schizophrenia'], ['identidade de gênero', 'gender identity'], ['luto', 'bereavement'], ['solidão', 'loneliness'], ['bullying', 'bullying'], ['escola', 'school'], ['adolescente', 'adolescents'], ['criança', 'children'], ['idoso', 'older adults']];
const AL_MESH = { 'generalized anxiety disorder': 'Anxiety Disorders', 'social anxiety disorder': 'Phobia, Social', anxiety: 'Anxiety', depression: 'Depressive Disorder', 'panic disorder': 'Panic Disorder', 'posttraumatic stress disorder': 'Stress Disorders, Post-Traumatic', 'obsessive-compulsive disorder': 'Obsessive-Compulsive Disorder', ADHD: 'Attention Deficit Disorder with Hyperactivity', 'autism spectrum disorder': 'Autism Spectrum Disorder', grief: 'Grief', bereavement: 'Bereavement', 'borderline personality disorder': 'Borderline Personality Disorder', 'self-harm': 'Self-Injurious Behavior', 'suicidal ideation': 'Suicidal Ideation', insomnia: 'Sleep Initiation and Maintenance Disorders', burnout: 'Burnout, Professional', stress: 'Stress, Psychological', 'binge eating disorder': 'Binge-Eating Disorder', 'bulimia nervosa': 'Bulimia Nervosa', 'anorexia nervosa': 'Anorexia Nervosa', 'alcohol use disorder': 'Alcohol-Related Disorders', 'substance use disorder': 'Substance-Related Disorders', 'specific phobia': 'Phobic Disorders', 'bipolar disorder': 'Bipolar Disorder', schizophrenia: 'Schizophrenia', psychosis: 'Psychotic Disorders', loneliness: 'Loneliness', bullying: 'Bullying', 'self-esteem': 'Self Concept' };
const AL_SYN = { anxiety: ['anxious', 'anxiet*'], depression: ['depressive symptoms', 'major depress*'], 'posttraumatic stress disorder': ['PTSD'], 'obsessive-compulsive disorder': ['OCD'], ADHD: ['attention deficit*'], 'autism spectrum disorder': ['autis*'], insomnia: ['sleep disturbance*'], burnout: ['occupational stress'], grief: ['prolonged grief', 'complicated grief'], 'binge eating disorder': ['binge eating'], 'self-harm': ['self-injur*', 'nonsuicidal self-injury'] };
const AL_APP_MESH = { 'cognitive behavioral therapy': 'Cognitive Behavioral Therapy', 'acceptance and commitment therapy': 'Acceptance and Commitment Therapy', 'psychodynamic therapy': 'Psychotherapy, Psychodynamic', 'systemic family therapy': 'Family Therapy', 'dialectical behavior therapy': 'Dialectical Behavior Therapy', 'mindfulness-based': 'Mindfulness' };
function alEnglish(txt) { const t = (txt || '').toLowerCase(); const out = []; for (const [pt, en] of AL_TERMS) if (t.includes(pt) && !out.includes(en)) out.push(en); const lat = t.match(/[a-z]{4,}(?:\s+[a-z]{3,}){0,2}/g); if (!out.length && /^[\x00-\x7f]*$/.test(t) && t.trim()) out.push(t.trim()); return out.filter((x, i) => !out.some((y, j) => j !== i && y.length > x.length && y.toLowerCase().includes(x.toLowerCase()))).slice(0, 4); }
const AL_POP = ['adolescents', 'children', 'older adults'];
const alLevel = pt => /meta-analysis/i.test(pt) ? [1, 'Meta-análise'] : /systematic review/i.test(pt) ? [2, 'Revisão sistemática'] : /randomized controlled/i.test(pt) ? [3, 'Ensaio randomizado'] : /guideline/i.test(pt) ? [2, 'Diretriz'] : /review/i.test(pt) ? [4, 'Revisão'] : [5, 'Estudo'];

async function alSearch(terms, o) {
  const grp = t => { const parts = []; if (AL_MESH[t]) parts.push('"' + AL_MESH[t] + '"[MeSH Terms]'); parts.push('"' + t + '"[tiab]'); (AL_SYN[t] || []).forEach(x => parts.push(x.includes('*') ? x + '[tiab]' : '"' + x + '"[tiab]')); return '(' + parts.join(' OR ') + ')'; };
  const POPM = { adolescents: 'Adolescent', children: 'Child', 'older adults': 'Aged' };
  const cond = terms.filter(t => !AL_POP.includes(t)), pop = terms.filter(t => AL_POP.includes(t));
  if (!cond.length) cond.push(...pop.splice(0));
  const core = (cond.length > 1 ? '(' + cond.map(grp).join(' OR ') + ')' : grp(cond[0])) + (pop.length ? ' AND (' + pop.map(t => '"' + POPM[t] + '"[MeSH Terms] OR "' + t + '"[tiab]').join(' OR ') + ')' : '');
  const type = { rev: '(meta-analysis[pt] OR systematic[sb] OR review[pt])', ens: '(randomized controlled trial[pt] OR clinical trial[pt])', any: '' }[o.type];
  const goal = { panorama: '', interv: '(psychotherapy OR "treatment outcome" OR intervention* OR efficacy)', mecan: '(etiology OR "risk factors" OR mechanisms OR "cognitive model")', instr: '(assessment OR psychometric OR screening OR validation OR scale*)' }[o.goal];
  const q = [core, goal, type, o.extra ? '(' + o.extra + ')' : '', 'hasabstract', o.years ? '(' + (new Date().getFullYear() - o.years) + ':3000[dp])' : ''].filter(Boolean).join(' AND ') + ' NOT (animals[mh] NOT humans[mh])';
  const base = 'https://eutils.ncbi.nlm.nih.gov/entrez/eutils/';
  const sr = await (await fetch(base + 'esearch.fcgi?db=pubmed&retmode=json&retmax=15&sort=relevance&term=' + encodeURIComponent(q))).json();
  const ids = sr.esearchresult?.idlist || [], total = sr.esearchresult?.count || 0; if (!ids.length) return { q, items: [], total };
  const xml = await (await fetch(base + 'efetch.fcgi?db=pubmed&retmode=xml&id=' + ids.join(','))).text();
  const doc = new DOMParser().parseFromString(xml, 'text/xml');
  const items = [...doc.querySelectorAll('PubmedArticle')].map(a => { const g = sel => a.querySelector(sel)?.textContent?.trim() || ''; const pts = [...a.querySelectorAll('PublicationType')].map(x => x.textContent).join('; '); const [lv, lab] = alLevel(pts);
    const ab = [...a.querySelectorAll('Abstract AbstractText')].map(x => (x.getAttribute('Label') ? x.getAttribute('Label') + ': ' : '') + x.textContent).join('\n');
    const au = [...a.querySelectorAll('Author')].map(x => ({ l: x.querySelector('LastName')?.textContent || x.querySelector('CollectiveName')?.textContent || '', i: (x.querySelector('Initials')?.textContent || '').split('').join('. ') + (x.querySelector('Initials') ? '.' : '') })).filter(x => x.l);
    const doi = [...a.querySelectorAll('ArticleId')].find(x => x.getAttribute('IdType') === 'doi')?.textContent;
    return { id: g('PMID'), title: g('ArticleTitle'), journal: g('Journal Title'), year: g('PubDate Year') || (g('PubDate MedlineDate') || '').slice(0, 4), au, abstract: ab, doi, level: lv, label: lab, url: 'https://pubmed.ncbi.nlm.nih.gov/' + g('PMID') + '/' }; });
  items.sort((x, y) => x.level - y.level || (y.year || 0) - (x.year || 0)); return { q, items, total };
}
const apa = x => { const au = x.au.slice(0, 6).map(a => a.l + ', ' + a.i).join(', ') + (x.au.length > 6 ? ', et al.' : ''); return `${au} (${x.year}). ${x.title.replace(/\.$/, '')}. ${x.journal}.${x.doi ? ' https://doi.org/' + x.doi : ''}`; };

  $('#view').innerHTML = `<div class="topbar"><div><div class="display">AlicIA</div><div class="muted">Busca científica com estratégia, para trabalhos e TCC. Ela mostra a conta que fez.</div></div></div>
  <div class="al-grid"><section class="card elev"><form id="alForm">

    <button class="btn" id="alGo" style="width:100%;margin-top:16px"><span class="ms">search</span>Buscar</button>
  </form></section>
  <section id="alOut"><div class="card elev"><div class="cardhead"><div class="title-m">Como montar uma busca boa</div></div><table class="ops"><tr><td>AND</td><td>Exige todos os termos. Estreita o resultado.</td></tr><tr><td>OR</td><td>Aceita qualquer sinônimo. Amplia o resultado.</td></tr><tr><td>NOT</td><td>Exclui um assunto (ex.: estudos em animais).</td></tr><tr><td>"frase exata"</td><td>Busca as palavras juntas, na ordem.</td></tr><tr><td>termo*</td><td>Truncamento: anxi* acha anxiety, anxious.</td></tr><tr><td>[MeSH Terms]</td><td>Descritor oficial do PubMed, que agrupa sinônimos.</td></tr><tr><td>[tiab]</td><td>Procura só no título e no resumo.</td></tr><tr><td>( )</td><td>Agrupa partes: (A OR B) AND C.</td></tr></table><div class="small muted" style="margin-top:10px">Dica: comece com as revisões. Elas já reúnem e comparam dezenas de estudos, e a lista de referências delas leva aos artigos originais.</div></div></section></div>`;
  let goal = 'panorama'; $$('#alGoal .chip').forEach(c => c.onclick = () => { goal = c.dataset.v; $$('#alGoal .chip').forEach(x => x.classList.toggle('on', x === c)); });
  $('#alForm').onsubmit = async e => {
    e.preventDefault(); const out = $('#alOut'), btn = $('#alGo'); btn.disabled = true; out.innerHTML = '<div class="card elev"><div class="empty"><span class="ms">search</span>Buscando nas bases…</div></div>';
    const txt = $('#alQ').value.trim(), manual = $('#alEn').value.split(',').map(x => x.trim()).filter(Boolean), terms = manual.length ? manual : alEnglish(txt);
    try {
      if (!terms.length) { out.innerHTML = '<div class="card elev"><div class="notice warn"><span class="ms">info</span><div>Não reconheci o tema. Preencha os termos em inglês (ex.: grief, adolescents) ou cite um tema como ansiedade, depressão, luto, TOC, insônia.</div></div></div>'; return; }
      const r = await alSearch(terms, { goal, type: $('#alType').value, years: +$('#alYears').value, extra: $('#alExtra').value.trim() });
      const enq = terms.map(t => '"' + t + '"').join(' OR '), ptq = encodeURIComponent(txt);
      out.innerHTML = `<div class="card elev" style="margin-bottom:12px"><div class="cardhead"><div class="title-m">Estratégia usada</div><span class="badge b-info">${Number(r.total).toLocaleString('pt-BR')} resultados no total</span></div><code class="q">${esc(r.q)}</code><div class="small muted">Mostro os 15 mais relevantes, com revisões e meta-análises primeiro. Se vieram poucos, tire o filtro de tipo ou amplie o período. Se vieram muitos, acrescente um termo com AND.</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px"><a class="btn tonal sm" target="_blank" rel="noopener" href="https://pubmed.ncbi.nlm.nih.gov/?term=${encodeURIComponent(r.q)}"><span class="ms">open_in_new</span>PubMed</a><a class="btn tonal sm" target="_blank" rel="noopener" href="https://scholar.google.com/scholar?q=${encodeURIComponent('(' + enq + ')')}"><span class="ms">open_in_new</span>Google Acadêmico</a><a class="btn tonal sm" target="_blank" rel="noopener" href="https://search.scielo.org/?q=${ptq}"><span class="ms">open_in_new</span>SciELO (português)</a><a class="btn tonal sm" target="_blank" rel="noopener" href="https://pesquisa.bvsalud.org/portal/?q=${ptq}"><span class="ms">open_in_new</span>BVS</a></div></div>` +
        (r.items.length ? r.items.map((x, i) => `<div class="al-res"><span class="badge ${x.level <= 2 ? 'b-ok' : 'b-neutral'}">${esc(x.label)}</span> <span class="m">${esc(x.year)}</span><h4>${esc(x.title)}</h4><div class="m">${esc(x.au.slice(0, 3).map(a => a.l).join(', ') + (x.au.length > 3 ? ' et al.' : ''))} · ${esc(x.journal)}</div>${x.abstract ? `<details><summary>Ler resumo</summary><p>${esc(x.abstract)}</p></details>` : ''}<div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap"><a class="btn text sm" href="${esc(x.url)}" target="_blank" rel="noopener"><span class="ms">open_in_new</span>PMID ${esc(x.id)}</a><button class="btn text sm" data-apa="${i}"><span class="ms">content_copy</span>Copiar referência (APA)</button></div></div>`).join('') : '<div class="card elev"><div class="empty"><span class="ms">search</span>Nada encontrado. Experimente trocar para "Qualquer tipo" ou ampliar o período.</div></div>') +
        '<div class="small muted" style="margin:8px 0">Bases públicas. Confira a referência antes de citar, e leia o artigo, não só o resumo. A formatação APA é uma base, ajuste conforme a norma da sua faculdade (ABNT, se for o caso).</div>';
      $$('[data-apa]', out).forEach(b => b.onclick = async () => { const t = apa(r.items[+b.dataset.apa]); try { await navigator.clipboard.writeText(t); snack('Referência copiada'); } catch (_) { prompt('Copie a referência:', t); } });
