<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#F7F3EA">
<title>Aprovação de conteúdo | Studio S</title>
<meta property="og:title" content="Conteúdo para a sua aprovação">
<meta property="og:description" content="Veja o cronograma e cada peça do mês. Aprove ou peça ajuste em um toque.">
<meta property="og:image" content="https://omatsaldanha.com/gestor/og-aprovar.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/gestor/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Fraunces';font-weight:600;font-display:swap;src:url('/assets/fonts/fraunces-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Fraunces';font-weight:600;font-style:italic;font-display:swap;src:url('/assets/fonts/fraunces-latin-600-italic.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:400;font-display:swap;src:url('/assets/fonts/space-grotesk-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:500;font-display:swap;src:url('/assets/fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:600;font-display:swap;src:url('/assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2')}
:root{--bg:#F7F3EA;--card:#fff;--bg3:#F1EBDD;--line:#E7DFCD;--line2:#D3C8B1;--text:#1F1C17;--dim:#685F50;--accent:#1F1C17;--on-accent:#fff;--amber:#E7B64A;--amber-ink:#8A6413;--amber-soft:#FBEFD2;--ok:#3F7550;--ok-soft:#E1EEDF;--warn:#B4572F;--warn-soft:#F8E3D8;--wip:#3B5E8C;--wip-soft:#DEE7F3;--serif:'Fraunces',Georgia,serif;--sans:'Space Grotesk',system-ui,-apple-system,sans-serif;--dw:600;--ds:normal;--dt:none;--shadow:0 1px 2px rgba(60,40,0,.06),0 12px 32px -16px rgba(60,40,0,.25)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;padding:0 clamp(16px,4vw,32px) 90px}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}
.hero{padding:40px 0 22px;display:grid;gap:14px}
.who{display:flex;align-items:center;gap:12px;color:var(--dim);font-size:13px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.av{width:46px;height:46px;border-radius:50%;background:var(--amber-soft);display:grid;place-items:center;overflow:hidden;font-family:var(--serif);color:var(--amber-ink);flex:none;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--accent)}
.av img{width:100%;height:100%;object-fit:cover}
h1,h2{font-family:var(--serif);font-weight:var(--dw);font-style:var(--ds);text-transform:var(--dt);margin:0;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:clamp(32px,6.4vw,62px);line-height:1}
h1 em{color:var(--accent);font-style:inherit}
h2{font-size:clamp(24px,3.4vw,34px);line-height:1.08}
.lede{color:var(--dim);max-width:58ch;margin:0;font-size:17px}
.goal{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;gap:12px}
/* cronograma */
.sched{display:grid;gap:12px;padding:6px 0 30px}
.sl{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.sl li{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.sl li:first-child{border-top:0}
.sl .d{font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}.sl .d small{display:block;color:var(--dim);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.sl .t{min-width:0}.sl .t a{color:inherit;font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--line2)}.sl .t b{font-weight:600}
.sl .t span{display:block;color:var(--dim);font-size:14px}
@media (max-width:600px){.sl li{grid-template-columns:68px minmax(0,1fr)}.sl .s{grid-column:2}}
.tag{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;padding:4px 10px;border-radius:6px;background:var(--bg3);color:var(--dim);white-space:nowrap;display:inline-block}
.tag.done{background:var(--ok-soft);color:var(--ok)}.tag.ready{background:var(--accent);color:var(--on-accent)}.tag.wip{background:var(--wip-soft);color:var(--wip)}.tag.todo{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line2)}
.tag.d{background:var(--text);color:var(--bg)}.tag.r{background:var(--amber-soft);color:var(--amber-ink)}
/* abas e barra */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--line2);background:var(--card);border-radius:99px;padding:8px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.tabs b{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:var(--on-accent);font-size:12px;margin-left:6px;padding:0 6px}
.bar{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-block:1px solid var(--line);margin:16px calc(clamp(16px,4vw,32px)*-1) 0;padding:10px clamp(16px,4vw,32px)}
.bar-in{max-width:1080px;margin:0 auto;display:flex;gap:10px 18px;align-items:center;flex-wrap:wrap}
.prog{display:flex;gap:4px;flex:1 1 160px;min-width:120px}.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}.prog i.ap{background:var(--ok)}.prog i.aj{background:var(--warn)}
.bar input{width:min(200px,46vw);padding:7px 10px;border:1px solid var(--line2);border-radius:8px;background:var(--card)}
/* peças */
.post{display:grid;grid-template-columns:minmax(0,var(--mw,360px)) minmax(0,1fr);gap:clamp(18px,5vw,52px);padding:40px 0;border-bottom:1px solid var(--line);align-items:start;scroll-margin-top:70px}
.post.reel{--mw:300px}
@media (max-width:760px){.post{grid-template-columns:minmax(0,1fr)}.post.reel .media{max-width:320px;width:100%;margin:0 auto}}
.media{min-width:0;display:grid;gap:12px}
.track{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;margin:0}
.slide img{display:block;width:100%;height:auto;border-radius:14px;background:var(--bg3);box-shadow:var(--shadow)}
.slide figcaption,.lbl{position:absolute;top:10px;right:10px;font-size:12px;font-weight:600;background:rgba(0,0,0,.68);color:#fff;padding:2px 9px;border-radius:99px}
.lbl{left:10px;right:auto}
video{width:100%;border-radius:16px;background:#000;display:block;max-height:80vh;aspect-ratio:9/16;object-fit:cover}
.dots{display:flex;gap:6px;justify-content:center}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line2)}.dots i.on{background:var(--text);width:20px;border-radius:4px}
.ph{aspect-ratio:var(--ar,3/4);border-radius:14px;border:1.5px dashed var(--line2);background:repeating-linear-gradient(135deg,var(--card) 0 14px,color-mix(in srgb,var(--line) 55%,var(--card)) 14px 28px);display:grid;place-items:center;padding:22px;text-align:center;position:relative}
.ph b{font-size:12px;letter-spacing:.1em;text-transform:uppercase;background:var(--accent);color:var(--on-accent);padding:4px 12px;border-radius:99px}
.ph span{display:block;color:var(--dim);font-size:15px;margin-top:8px;max-width:24ch}
.capa{position:relative}.capa img{width:100%;border-radius:14px;display:block;box-shadow:var(--shadow)}
.capa.sm{max-width:180px}
.info{display:grid;gap:14px;min-width:0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.box{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px}
.box b.k{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.cap{white-space:pre-wrap;overflow-wrap:anywhere}
details.rot{border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 16px}
details.rot summary{cursor:pointer;font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
details.rot .cap{margin-top:10px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;border:1.5px solid var(--line2);background:var(--card);cursor:pointer;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--text)}
.btn.ok{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.warn{border-color:var(--warn);color:var(--warn);background:transparent}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.actions{display:flex;gap:10px;flex-wrap:wrap}.actions .btn{flex:1 1 150px}
.form{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{min-height:34px;padding:0 12px;border-radius:99px;border:1.5px solid var(--line2);background:transparent;cursor:pointer;font-size:14px}
.chip[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
textarea{width:100%;min-height:100px;padding:10px 12px;border:1.5px solid var(--line2);border-radius:10px;resize:vertical;background:var(--bg)}
.res{padding:12px 14px;border-radius:14px}.res.ap{background:var(--ok-soft);color:var(--ok)}.res.aj{background:var(--warn-soft);color:#5b2c16}
.hist{font-size:14px;color:var(--dim)}.hist li{margin:4px 0}
.empty{padding:50px 0;text-align:center;color:var(--dim)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.foot{margin-top:40px;font-size:13px;color:var(--dim);text-align:center}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Carregando…</div></div>
<div class="toast" id="toast"></div>
<script src="/gestor/vendor/supabase.js"></script>
<script>
(() => {
const CFG = window.GESTOR_CFG || { url: 'https://uwpbvolvzftrcnjuwoao.supabase.co', key: 'sb_publishable_Yfi_WJXhCwcNJ0DvklVjfA_Uz3RVOBu' };
const sb = supabase.createClient(CFG.url, CFG.key, { auth: { persistSession: false } });
const TOKEN = new URLSearchParams(location.search).get('c');
const STUDIO_WA = '5553991662471';
const GATES = { pauta_aprovar: ['pauta', 'Pautas', 'Ideias do mês: tema, objetivo e como cada uma ajuda no objetivo do período.'], copy_aprovar: ['copy', 'Roteiros e legendas', 'Textos de cada peça. Aprove antes da gravação.'], post_aprovar: ['post', 'Posts prontos', 'As peças prontas, com capa, do jeito que vão ao ar.'] };
const FMT = { reels: 'Reels', carrossel: 'Carrossel', estatico: 'Post estático', stories: 'Stories' };
const FUN = { topo: 'topo de funil', meio: 'meio de funil', fundo: 'fundo de funil' };
const BRANDS = {
  weinerth: { v: { '--bg': '#EAF0F1', '--card': '#FFFFFF', '--bg3': '#DCE8EB', '--line': '#D0DDE0', '--line2': '#AFC3C9', '--text': '#073C4C', '--dim': '#4F6F7A', '--accent': '#0A4B5D', '--amber-soft': '#D9EEF3', '--amber-ink': '#0A4B5D', '--serif': '"Montserrat",system-ui,sans-serif', '--sans': '"Montserrat",system-ui,sans-serif', '--dw': '800' }, f: 'https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;800&display=swap' },
  varela: { v: { '--bg': '#ECF1F3', '--card': '#FFFFFF', '--bg3': '#DFE8ED', '--line': '#D3DDE3', '--line2': '#B4C4CE', '--text': '#0B2230', '--dim': '#53697A', '--accent': '#1F6FB5', '--amber-soft': '#DDEBF8', '--amber-ink': '#1F6FB5', '--serif': '"Newsreader",Georgia,serif', '--sans': '"Instrument Sans",system-ui,sans-serif', '--dw': '400' }, f: 'https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Instrument+Sans:wght@400;500;600&display=swap' },
  power: { v: { '--bg': '#FAF6F8', '--card': '#FFFFFF', '--bg3': '#F2E8ED', '--line': '#E4DBE0', '--line2': '#CDBFC7', '--text': '#151317', '--dim': '#6B6369', '--accent': '#D3156F', '--amber-soft': '#FBE1EE', '--amber-ink': '#D3156F', '--serif': '"Barlow Condensed","Arial Narrow",sans-serif', '--sans': '"Barlow",system-ui,sans-serif', '--dw': '800', '--ds': 'italic', '--dt': 'uppercase' }, f: 'https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800&family=Barlow:wght@400;500;600&display=swap' }
};
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const pdt = s => new Date(s + 'T12:00');
const fmtD = s => s ? pdt(s).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' }).replace('.', '') : 'Data a definir';
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), 2400); }
let D = null, gate = null, name = ''; try { name = localStorage.getItem('aprov-nome') || ''; } catch (_) {}
const done = {};

function theme(c) {
  const b = BRANDS[c.brand]; if (!b) return;
  Object.entries(b.v).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
  document.querySelector('meta[name=theme-color]').content = b.v['--bg'];
  if (!document.querySelector('link[data-bf]')) { const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = b.f; l.dataset.bf = '1'; document.head.appendChild(l); }
}
function stOf(st) {
  if (st === 'publicado') return ['Publicado', 'done'];
  if (st === 'agendado' || st === 'agendar') return ['Aprovado', 'done'];
  if (st in GATES) return ['Para aprovar', 'ready'];
  if (st === 'producao') return ['Em produção', 'wip'];
  if (st === 'edicao' || st === 'revisao') return ['Em edição', 'wip'];
  if (st === 'copy') return ['Escrevendo', 'wip'];
  return ['Ideia', 'todo'];
}
async function load() {
  if (!TOKEN) { $('#app').innerHTML = '<div class="empty">Link incompleto. Peça o link de aprovação de novo.</div>'; return; }
  const { data, error } = await sb.rpc('client_board', { p_token: TOKEN });
  if (error) { $('#app').innerHTML = `<div class="empty">${/inválido/.test(error.message) ? 'Esse link não vale mais. Peça um novo ao Studio S.' : 'Não consegui carregar agora. Tente de novo em instantes.'}</div>`; return; }
  D = data; D.schedule = (D.schedule || []).sort((a, b) => String(a.publish_date || '9').localeCompare(String(b.publish_date || '9'))); theme(D.client);
  const waiting = k => D.posts.filter(p => p.status === k).length;
  if (!gate || !waiting(gate)) gate = Object.keys(GATES).find(k => waiting(k)) || 'pauta_aprovar';
  render();
}
function schedHtml() {
  const m0 = new Date(); const mk = `${m0.getFullYear()}-${String(m0.getMonth() + 1).padStart(2, '0')}`;
  const L = D.schedule.filter(s => !s.publish_date || s.publish_date.slice(0, 7) >= mk);
  if (!L.length) return '';
  const inPosts = new Set(D.posts.map(p => p.id));
  return `<section class="sched" aria-labelledby="sh"><h2 id="sh">Cronograma</h2><ol class="sl">${L.map(s => {
    const [lab, k] = stOf(s.status), d = s.publish_date ? pdt(s.publish_date) : null;
    const date = d ? `<div class="d"><small>${DOW[d.getDay()]}</small>${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}</div>` : '<div class="d"><small>data</small>a definir</div>';
    const t = inPosts.has(s.id) && s.status in GATES ? `<a href="#p-${s.id}" data-go="${s.status}" data-id="${s.id}">${esc(s.title)}</a>` : `<b>${esc(s.title)}</b>`;
    return `<li>${date}<div class="t">${t}<span>${esc([FMT[s.format], FUN[s.funnel]].filter(Boolean).join(' · '))}</span></div><div class="s"><span class="tag ${k}">${lab}</span></div></li>`;
  }).join('')}</ol></section>`;
}
function render() {
  const c = D.client, plan = (D.plans || []).slice(-1)[0];
  const ig = (c.instagram || '').replace(/^@/, '');
  const av = c.avatar_url || '';
  const L = D.posts.filter(p => p.status === gate || (done[p.id] && done[p.id].gate === gate));
  const pend = L.filter(p => !done[p.id]);
  const total = Object.keys(GATES).reduce((a, k) => a + D.posts.filter(p => p.status === k).length, 0);
  const mes = new Date().toLocaleDateString('pt-BR', { month: 'long' });
  $('#app').innerHTML = `
  <header class="hero">
    <div class="who"><span class="av">${av ? `<img src="${esc(av)}" alt="" referrerpolicy="no-referrer">` : esc((c.name || '?')[0])}</span>Studio S · ${esc(c.name)}</div>
    <h1>Cronograma de ${esc(mes)}, <em>para sua aprovação</em></h1>
    <p class="lede">${total ? `Tem ${total} ${total === 1 ? 'item esperando' : 'itens esperando'} você. Veja o cronograma e, abaixo, cada peça. Aprove uma por uma ou tudo de uma vez; se algo precisar mudar, toque em Pedir ajuste.` : 'Tudo respondido por aqui. Obrigado! Quando tiver material novo, ele aparece neste mesmo link.'}</p>
    ${plan?.objective ? `<div class="goal"><span style="font-size:22px">🎯</span><div><b>Objetivo do mês</b><div>${esc(plan.objective)}</div></div></div>` : ''}
  </header>
  ${schedHtml()}
  <div class="tabs">${Object.entries(GATES).map(([k, g]) => { const n = D.posts.filter(p => p.status === k).length; return `<button aria-pressed="${gate === k}" data-gate="${k}">${g[1]}${n ? `<b>${n}</b>` : ''}</button>`; }).join('')}</div>
  <div class="bar"><div class="bar-in">
    <div class="prog" aria-hidden="true">${L.map(p => `<i class="${done[p.id] ? (done[p.id].decision === 'aprovado' ? 'ap' : 'aj') : ''}"></i>`).join('')}</div>
    <span style="font-size:14px;font-weight:600">${L.length - pend.length} de ${L.length} respondidos</span>
    ${pend.length > 1 ? `<button class="btn ok sm" id="allOk">Aprovar tudo (${pend.length})</button>` : ''}
    <label style="font-size:14px;color:var(--dim)">Seu nome <input id="who" value="${esc(name)}" placeholder="Seu nome" autocomplete="name" maxlength="60"></label>
  </div></div>
  <p style="color:var(--dim);font-size:14px;margin:14px 0 0">${esc(GATES[gate][2])}</p>
  <main>${L.length ? L.map(postHtml).join('') : '<div class="empty">Nada para aprovar nesta etapa agora.</div>'}</main>
  <div class="foot">Prefere falar direto? <a href="https://wa.me/${STUDIO_WA}" target="_blank" rel="noopener">Chamar o Studio S no WhatsApp</a></div>`;
  $('#who').oninput = e => { name = e.target.value; try { localStorage.setItem('aprov-nome', name); } catch (_) {} };
  $$('[data-gate]').forEach(b => b.onclick = () => { gate = b.dataset.gate; render(); scrollTo(0, 0); });
  $$('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); gate = a.dataset.go; render(); const el = document.getElementById('p-' + a.dataset.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  const all = $('#allOk'); if (all) all.onclick = approveAll;
  $$('.post').forEach(bind);
}
function coverHtml(p, small) {
  if (p.cover?.url) return `<div class="capa ${small ? 'sm' : ''}"><span class="lbl">Capa</span><img src="${esc(p.cover.url)}" alt="Capa de ${esc(p.title)}" loading="lazy"></div>`;
  if (p.format === 'reels' && gate === 'post_aprovar') return `<div class="ph" style="--ar:9/16;max-width:180px"><div><b>Capa</b><span>Capa em produção</span></div></div>`;
  return '';
}
function mediaHtml(p) {
  const M = p.media || [], vid = M.find(m => m.type === 'video'), imgs = M.filter(m => m.type === 'image');
  if (gate !== 'post_aprovar') {
    const lbl = gate === 'pauta_aprovar' ? 'Ideia' : (p.format === 'reels' ? 'A gravar' : 'A produzir');
    const note = gate === 'pauta_aprovar' ? 'Aprove a ideia; o roteiro e a legenda vêm na próxima etapa.' : (p.format === 'reels' ? 'Roteiro e legenda para aprovar antes da gravação.' : 'Textos dos cards e legenda para aprovar antes da arte.');
    return `<div class="ph" style="--ar:${p.format === 'reels' ? '9/16' : '3/4'}"><div><b>${lbl}</b><span>${note}</span></div></div>${coverHtml(p, true)}`;
  }
  if (vid) return `<video controls playsinline preload="metadata" src="${esc(vid.url)}" poster="${esc(p.cover?.url || vid.poster || '')}"></video>${coverHtml(p, true)}`;
  if (imgs.length) return `<div class="track">${imgs.map((m, i) => `<figure class="slide"><img src="${esc(m.url)}" alt="${esc(p.title)}, ${i + 1} de ${imgs.length}" loading="lazy" ${m.w ? `width="${m.w}" height="${m.h}"` : ''}><figcaption>${i + 1}/${imgs.length}</figcaption></figure>`).join('')}</div>${imgs.length > 1 ? `<div class="dots">${imgs.map((_, i) => `<i class="${i ? '' : 'on'}"></i>`).join('')}</div>` : ''}${coverHtml(p, true)}`;
  return `<div class="ph"><div><b>Em produção</b><span>O arquivo final chega aqui.</span></div></div>${coverHtml(p, true)}`;
}
function targets(p) {
  const t = [['geral', gate === 'pauta_aprovar' ? 'Ideia toda' : 'Tudo']];
  if (gate === 'post_aprovar') { const imgs = (p.media || []).filter(m => m.type === 'image'); if ((p.media || []).some(m => m.type === 'video')) t.push(['vídeo', 'Vídeo']); else imgs.forEach((_, i) => t.push(['slide ' + (i + 1), 'Slide ' + (i + 1)])); if (p.cover) t.push(['capa', 'Capa']); }
  if (gate !== 'pauta_aprovar') { if (p.script) t.push(['roteiro', 'Roteiro']); if (p.copy) t.push(['legenda', 'Legenda']); }
  return t;
}
function postHtml(p) {
  const d = done[p.id];
  const hist = (p.history || []).filter(h => h.decision === 'ajuste');
  const reel = p.format === 'reels';
  return `<article class="post ${reel ? 'reel' : ''}" id="p-${p.id}" data-id="${p.id}"><div class="media">${mediaHtml(p)}</div>
    <div class="info">
      <div class="tags"><span class="tag d">${fmtD(p.publish_date)}</span><span class="tag">${esc(FMT[p.format] || p.format)}</span>${p.funnel ? `<span class="tag">${esc(FUN[p.funnel])}</span>` : ''}${p.pillar ? `<span class="tag">${esc(p.pillar)}</span>` : ''}${p.round > 1 ? `<span class="tag r">Rodada ${p.round} · revisado</span>` : ''}</div>
      <h2>${esc(p.title)}</h2>
      ${p.objective ? `<div class="box"><b class="k">Objetivo deste post</b>${esc(p.objective)}</div>` : ''}
      ${p.relation ? `<div class="box"><b class="k">Como ajuda no objetivo do mês</b>${esc(p.relation)}</div>` : ''}
      ${gate !== 'pauta_aprovar' && p.copy ? `<div class="box"><b class="k">Legenda <button class="btn sm" data-copy>Copiar</button></b><div class="cap">${esc(p.copy)}</div></div>` : ''}
      ${gate !== 'pauta_aprovar' && p.script ? `<details class="rot" ${gate === 'copy_aprovar' ? 'open' : ''}><summary>${reel ? 'Roteiro do vídeo' : 'Texto dos cards'}</summary><div class="cap">${esc(p.script)}</div></details>` : ''}
      ${hist.length ? `<details class="hist"><summary>O que você pediu antes</summary><ul>${hist.map(h => `<li><b>Rodada ${h.round}</b>${h.target && h.target !== 'geral' ? ' (' + esc(h.target) + ')' : ''}: ${esc(h.comment)}</li>`).join('')}</ul></details>` : ''}
      ${d ? `<div class="res ${d.decision === 'aprovado' ? 'ap' : 'aj'}"><b>${d.decision === 'aprovado' ? 'Aprovado. Obrigado!' : 'Pedido de ajuste enviado.'}</b>${d.comment ? `<div>${esc(d.comment)}</div>` : ''}</div>` : `
      <div class="actions"><button class="btn ok" data-ok>Aprovar</button><button class="btn warn" data-adj>Pedir ajuste</button></div>
      <form class="form" hidden><div class="chips">${targets(p).map(([v, l], i) => `<button type="button" class="chip" data-t="${esc(v)}" aria-pressed="${i === 0}">${esc(l)}</button>`).join('')}</div>
        <textarea placeholder="O que precisa mudar? Quanto mais detalhe, melhor."></textarea>
        <div class="actions"><button class="btn warn">Enviar pedido</button><button type="button" class="btn" data-cancel>Cancelar</button></div></form>`}
    </div></article>`;
}
function bind(el) {
  const p = D.posts.find(x => x.id === el.dataset.id), tr = $('.track', el);
  if (tr) tr.addEventListener('scroll', () => { const i = Math.round(tr.scrollLeft / tr.clientWidth); $$('.dots i', el).forEach((d, j) => d.classList.toggle('on', i === j)); }, { passive: true });
  const cp = $('[data-copy]', el); if (cp) cp.onclick = () => navigator.clipboard?.writeText(p.copy).then(() => toast('Legenda copiada'));
  const form = $('form', el); if (!form) return;
  let target = 'geral';
  $$('[data-t]', el).forEach(b => b.onclick = () => { target = b.dataset.t; $$('[data-t]', el).forEach(x => x.setAttribute('aria-pressed', x === b)); });
  $('[data-ok]', el).onclick = () => decide(p, 'aprovado', '', 'geral');
  $('[data-adj]', el).onclick = () => { form.hidden = false; $('.actions', el).hidden = true; $('textarea', form).focus(); };
  $('[data-cancel]', el).onclick = () => { form.hidden = true; $('.actions', el).hidden = false; };
  form.onsubmit = e => { e.preventDefault(); const t = $('textarea', form).value.trim(); if (!t) { toast('Escreva o que precisa mudar'); return; } decide(p, 'ajuste', t, target); };
}
function askName() { if (!name.trim()) { const n = prompt('Seu nome, para o Studio S saber quem respondeu:'); if (n) { name = n.trim(); try { localStorage.setItem('aprov-nome', name); } catch (_) {} } } }
async function decide(p, decision, comment, target, quiet) {
  if (!quiet) askName();
  const { error } = await sb.rpc('client_decide', { p_token: TOKEN, p_post: p.id, p_decision: decision, p_comment: comment, p_name: name || 'Cliente', p_target: target });
  if (error) { if (!quiet) { toast(/aguardando/.test(error.message) ? 'Esse item já foi respondido.' : 'Não consegui enviar. Tente de novo.'); load(); } return false; }
  done[p.id] = { decision, comment, gate };
  if (!quiet) { toast(decision === 'aprovado' ? 'Aprovado' : 'Ajuste enviado ao Studio S'); const y = scrollY; render(); scrollTo(0, y); }
  return true;
}
async function approveAll() {
  const L = D.posts.filter(p => p.status === gate && !done[p.id]); if (!L.length) return;
  if (!confirm(`Aprovar ${L.length} ${L.length === 1 ? 'item' : 'itens'} de ${GATES[gate][1].toLowerCase()} de uma vez?`)) return;
  askName(); let ok = 0; for (const p of L) if (await decide(p, 'aprovado', '', 'geral', true)) ok++;
  toast(`${ok} ${ok === 1 ? 'item aprovado' : 'itens aprovados'}. Obrigado!`); const y = scrollY; render(); scrollTo(0, y);
}
load();
})();
</script>
