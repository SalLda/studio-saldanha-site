<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1C1C1C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gestor">
<title>Gestor | Studio Saldanha</title>
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:'Fraunces';font-weight:600;font-display:swap;src:url('../assets/fonts/fraunces-latin-600-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:400;font-display:swap;src:url('../assets/fonts/space-grotesk-latin-400-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:500;font-display:swap;src:url('../assets/fonts/space-grotesk-latin-500-normal.woff2') format('woff2')}
@font-face{font-family:'Space Grotesk';font-weight:600;font-display:swap;src:url('../assets/fonts/space-grotesk-latin-600-normal.woff2') format('woff2')}
:root{
  --bg:#1C1C1C;--bg2:#262420;--bg3:#2E2B26;--line:#312E29;--line2:#46423A;
  --text:#EBE3D5;--dim:#A39B8E;--faint:#857E71;
  --amber:#E7B64A;--sage:#819A80;--terra:#D69475;--red:#E07A6A;--blue:#8FA9C9;--purple:#B79BC9;
  --serif:'Fraunces',Georgia,serif;--sans:'Space Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--amber)}
.hidden{display:none!important}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
/* login */
.login{min-height:100dvh;display:grid;place-items:center;padding:24px 16px}
.login form{width:100%;max-width:360px;background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:28px}
.login h1{font-size:28px;margin-bottom:4px}
.login p{color:var(--dim);margin:0 0 20px}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 6px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--amber)}
textarea{min-height:90px;resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--bg3);border-radius:999px;padding:8px 14px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--dim)}
.btn.primary{background:var(--amber);border-color:var(--amber);color:#1C1C1C;font-weight:600}
.btn.ghost{background:transparent}
.btn.danger{color:var(--red);border-color:#5a3530}
.btn.small{padding:5px 10px;font-size:13px}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
/* header */
header{position:sticky;top:0;z-index:20;background:rgba(28,28,28,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}
.brand{font-family:var(--serif);font-size:20px}
.brand span{color:var(--amber)}
.top .sp{flex:1}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:7px 14px;cursor:pointer;white-space:nowrap;color:var(--dim)}
.tab.on{background:var(--text);color:#1C1C1C;border-color:var(--text);font-weight:600}
main{padding:20px 0 80px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.monthnav{display:flex;align-items:center;gap:8px}
.monthnav strong{font-family:var(--serif);font-size:22px;min-width:180px;text-align:center}
section.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:16px}
section.card>h2{font-size:20px;margin-bottom:12px}
.sub{color:var(--dim);font-size:13px}
/* status */
.status{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:30px;line-height:1.1}
.stat span{font-size:13px;color:var(--dim)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.s-copy_aprovar{--c:var(--terra)}.s-editar{--c:var(--purple)}.s-pronto{--c:var(--sage)}.s-programar{--c:var(--blue)}.s-publicado{--c:var(--amber)}
.stat .dot,.chip .dot{background:var(--c)}
.bar{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--bg);margin-top:12px}
.bar i{display:block;height:100%;background:var(--c)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:12px;color:var(--faint);text-align:center;padding-bottom:2px}
.day{min-height:96px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.day:hover{border-color:var(--line2)}
.day.out{opacity:.35}
.day.today{border-color:var(--amber)}
.day .n{font-size:12px;color:var(--dim)}
.chip{display:block;width:100%;text-align:left;font-size:12px;line-height:1.25;background:var(--bg3);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:6px;padding:4px 6px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmt{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin-right:4px}
.agenda{display:none}
.agenda .it{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.agenda .d{min-width:52px;color:var(--dim);font-size:13px}
.agenda .chip{white-space:normal}
/* metrics */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi span{font-size:12px;color:var(--dim)}
.kpi b{display:block;font-family:var(--serif);font-size:24px}
.kpi em{font-style:normal;font-size:12px}
.up{color:var(--sage)}.down{color:var(--red)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:500;font-size:12px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto}
.insights{margin:12px 0 0;padding-left:18px}
.insights li{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* swipe */
.swipe{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.sw{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.sw h3{font-size:17px}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line2);border-radius:99px;padding:2px 8px;color:var(--dim);margin-right:4px}
.tag.n{color:var(--amber);border-color:#5b4a22}
.sw .hook{font-family:var(--serif);font-size:15px;color:var(--text);border-left:2px solid var(--amber);padding-left:10px}
.sw p{margin:0;font-size:13px;color:var(--dim)}
.sw .act{margin-top:auto;display:flex;gap:6px}
/* modal */
dialog{border:1px solid var(--line2);background:var(--bg2);color:var(--text);border-radius:18px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:20px}
dialog h2{font-size:22px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.mact .sp{flex:1}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--text);color:#1C1C1C;padding:10px 16px;border-radius:99px;font-weight:500;z-index:50;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.empty{color:var(--faint);font-size:14px;padding:8px 0}
@media (max-width:760px){
  .status{grid-template-columns:repeat(2,1fr)}
  .status .stat:last-child{grid-column:span 2}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .cal{display:none}.agenda{display:block}
  .monthnav strong{min-width:0;font-size:19px}
  .fr{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div id="loginView" class="login hidden">
  <form id="loginForm" autocomplete="on">
    <h1>Gestor</h1>
    <p>Área privada do Studio Saldanha.</p>
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username" required>
    <label for="pass">Senha</label>
    <input id="pass" type="password" autocomplete="current-password" required minlength="8">
    <div id="pass2Wrap" class="hidden"><label for="pass2">Repita a senha</label>
    <input id="pass2" type="password" autocomplete="new-password" minlength="8"></div>
    <div style="margin-top:18px"><button class="btn primary" type="submit" id="loginBtn" style="width:100%;justify-content:center">Entrar</button></div>
    <div class="err" id="loginErr"></div>
    <div style="display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:13px">
      <a href="#" id="toggleMode">Primeiro acesso? Criar conta</a>
      <a href="#" id="forgot">Esqueci a senha</a>
    </div>
  </form>
</div>

<div id="appView" class="hidden">
  <header>
    <div class="wrap">
      <div class="top">
        <div class="brand">Gestor<span>.</span></div>
        <div class="sp"></div>
        <button class="btn small ghost" id="logout">Sair</button>
      </div>
      <nav class="tabs" id="tabs"></nav>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<dialog id="postDlg"><form method="dialog" id="postForm">
  <h2 id="postTitle">Post</h2>
  <div class="fr">
    <div><label>Data de publicação</label><input type="date" name="publish_date"></div>
    <div><label>Formato</label><select name="format">
      <option value="reels">Reels</option><option value="carrossel">Carrossel</option><option value="estatico">Estático</option><option value="stories">Stories</option></select></div>
  </div>
  <label>Tema / título</label><input name="title" required maxlength="200">
  <label>Status</label><select name="status"></select>
  <label>Copy / roteiro</label><textarea name="copy" rows="6"></textarea>
  <label>Observações</label><textarea name="notes" rows="2"></textarea>
  <label>Link do post publicado</label><input name="permalink" type="url" placeholder="https://www.instagram.com/p/...">
  <div class="mact"><button type="button" class="btn danger" id="postDel">Excluir</button><div class="sp"></div>
    <button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" value="save">Salvar</button></div>
</form></dialog>

<dialog id="swDlg"><form method="dialog" id="swForm">
  <h2>Formato no swipe file</h2>
  <div class="fr">
    <div><label>Nicho</label><select name="niche"><option>Psicólogo</option><option>Médico veterinário</option><option>Médico</option><option>Geral</option></select></div>
    <div><label>Formato</label><select name="format"><option>Reels</option><option>Carrossel</option><option>Estático</option><option>Stories</option></select></div>
  </div>
  <label>Nome do formato</label><input name="title" required maxlength="160">
  <label>Gancho de exemplo</label><input name="hook" maxlength="300">
  <label>Estrutura</label><textarea name="structure" rows="3"></textarea>
  <label>Por que funciona</label><textarea name="why" rows="2"></textarea>
  <label>Link de referência</label><input name="example_url" type="url" placeholder="https://">
  <div class="mact"><button type="button" class="btn danger" id="swDel">Excluir</button><div class="sp"></div>
    <button type="button" class="btn ghost" data-close>Cancelar</button><button class="btn primary" value="save">Salvar</button></div>
</form></dialog>

<input type="file" id="csvInput" accept=".csv,text/csv" class="hidden">
<div class="toast" id="toast"></div>

(() => {

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true } });

const STATUS = [
  ['copy_aprovar','A aprovar copy'],['editar','A editar'],['pronto','Prontos'],['programar','A programar'],['publicado','Publicados']
];

const FMT = {reels:'Reels',carrossel:'Carrossel',estatico:'Estático',stories:'Stories'};

  {name:'Weinerth',handle:'',niche:'',position:1},

  {niche:'Psicólogo',format:'Reels',title:'Pergunta que o paciente não faz em voz alta',hook:'“Será que eu tô exagerando?” Essa é a dúvida que mais aparece antes da primeira sessão.',structure:'Abre com a frase entre aspas na tela → 2 ou 3 sinais concretos de quando vale procurar ajuda → fecha com uma frase curta, sem promessa.',why:'O espectador vê a própria dúvida escrita e manda para quem precisa ouvir. Gera compartilhamento por Direct, que é o sinal que mais distribui Reels hoje.'},

  {niche:'Psicólogo',format:'Reels',title:'Como funciona por dentro (bastidor da terapia)',hook:'O que acontece na primeira sessão de terapia, do começo ao fim.',structure:'Passo a passo da primeira sessão (chegada, combinados, sigilo, frequência, valores de forma geral) → tira o medo do desconhecido.',why:'Reduz a barreira de entrada de quem nunca fez terapia. Não expõe paciente nem promete resultado.'},
  {niche:'Psicólogo',format:'Reels',title:'Comentário de cena/caso cultural',hook:'Essa cena da série mostra direitinho o que é apego ansioso.',structure:'Recorte curto ou descrição da cena → nome do conceito → 2 sinais na vida real → convite à reflexão.',why:'Aproveita assunto em alta e ensina um conceito com algo que o público já viu. Bom para alcance de não seguidores.'},
  {niche:'Psicólogo',format:'Carrossel',title:'Checklist de autoconhecimento (salvável)',hook:'Antes de dizer sim para tudo, se pergunta isso',structure:'Capa com promessa clara de utilidade → 5 a 7 perguntas, uma por slide → slide final para salvar.',why:'Formato de consulta: a pessoa salva para voltar. Salvamento sinaliza valor ao algoritmo.'},
  {niche:'Médico veterinário',format:'Reels',title:'Mito do tutor',hook:'Dar leite pro gato é carinho? Vamos falar disso.',structure:'Frase do mito na tela → reação/negação → explicação em 15–20s com o animal em cena → o que fazer no lugar.',why:'Mito com animal em cena prende atenção e é muito compartilhado entre tutores. Lifelearn lista myth-busting entre os Reels que mais performam para clínicas.'},

  {niche:'Médico',format:'Carrossel',title:'FAQ do consultório',hook:'As 6 perguntas que eu mais ouço antes de uma cirurgia',structure:'Capa com a promessa → 1 pergunta e resposta por slide → slide final com como agendar avaliação.',why:'Reduz objeções antes da consulta e é salvo pelo público. Não promete resultado nem compara colegas.'},

const $ = (s, el=document) => el.querySelector(s);

const fmtN = n => (n ?? 0).toLocaleString('pt-BR');

// ---------- auth ----------
async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if (session) start(session.user); else showLogin();
  sb.auth.onAuthStateChange(async (ev, s) => {
    if (ev==='SIGNED_OUT') showLogin();
    if (ev==='PASSWORD_RECOVERY') {

function renderCalendar(){
  const m=S.month, first=new Date(m), startDow=(first.getDay()+6)%7; // segunda primeiro
  const gridStart=new Date(m.getFullYear(), m.getMonth(), 1-startDow);
  const byDay={}; S.posts.forEach(p=>{(byDay[p.publish_date]=byDay[p.publish_date]||[]).push(p);});
  const today=iso(new Date());
  let cal='<div class="cal">'+['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<42;i++){
    const d=new Date(gridStart.getFullYear(),gridStart.getMonth(),gridStart.getDate()+i), k=iso(d);
    if(i>=35 && d.getMonth()!==m.getMonth()) break;
    cal+=`<div class="day ${d.getMonth()!==m.getMonth()?'out':''} ${k===today?'today':''}" data-day="${k}"><span class="n">${d.getDate()}</span>${(byDay[k]||[]).map(chip).join('')}</div>`;
  }
  cal+='</div>';
  const days=Object.keys(byDay).sort();
  let ag='<div class="agenda">'+(days.length?days.map(k=>{const d=new Date(k+'T12:00');return `<div class="it"><div class="d">${d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit'})}</div><div style="flex:1;display:grid;gap:6px">${byDay[k].map(chip).join('')}</div></div>`;}).join(''):'<div class="empty">Nenhum post neste mês ainda.</div>')+'</div>';
  $('#cal').innerHTML=cal+ag;
  $('#cal').querySelectorAll('[data-day]').forEach(el=>el.addEventListener('click',e=>{ if(e.target.closest('[data-post]'))return; openPost({publish_date:el.dataset.day}); }));
  $('#cal').querySelectorAll('[data-post]').forEach(el=>el.addEventListener('click',()=>openPost(S.posts.find(p=>p.id===el.dataset.post))));
}

// ---------- metrics ----------
function eng(x){ return (x.likes||0)+(x.comments||0)+(x.shares||0)+(x.saves||0); }
function summary(list){
  const n=list.length, reach=list.reduce((a,x)=>a+(x.reach||0),0), views=list.reduce((a,x)=>a+(x.views||0),0), e=list.reduce((a,x)=>a+eng(x),0);
  return {n,reach,views,eng:e,avgReach:n?reach/n:0,er:reach?e/reach:NaN,saves:list.reduce((a,x)=>a+(x.saves||0),0),shares:list.reduce((a,x)=>a+(x.shares||0),0),follows:list.reduce((a,x)=>a+(x.follows||0),0)};
}
function delta(cur,prev){ if(!prev||!isFinite(prev)||!isFinite(cur))return ''; const d=(cur-prev)/prev; return `<em class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${pct(Math.abs(d))} vs mês anterior</em>`; }
function typeLabel(t){ t=(t||'').toLowerCase(); if(t.includes('reel'))return 'Reels'; if(t.includes('carr')||t.includes('carousel'))return 'Carrossel'; if(t.includes('imag')||t.includes('photo')||t.includes('foto'))return 'Estático'; return t?t[0].toUpperCase()+t.slice(1):'Outro'; }
function renderMetrics(){
  const L=S.metrics, el=$('#metrics');
  if(!L.length){ el.innerHTML='<div class="empty" style="margin-top:12px">Nenhuma métrica deste mês ainda. Importe o CSV do Meta para ver a análise automática.</div>'; return; }
  const s=summary(L), p=summary(S.prevMetrics);
  const byFmt={}; L.forEach(x=>{const k=typeLabel(x.post_type);(byFmt[k]=byFmt[k]||[]).push(x);});
  const fmtRows=Object.entries(byFmt).map(([k,v])=>[k,summary(v)]).sort((a,b)=>b[1].er-a[1].er);
  const wd={}; L.forEach(x=>{ if(!x.published_at)return; const d=new Date(x.published_at).toLocaleDateString('pt-BR',{weekday:'long'}); (wd[d]=wd[d]||[]).push(x);});
  const wdRows=Object.entries(wd).map(([k,v])=>[k,summary(v)]).filter(r=>r[1].n>=1).sort((a,b)=>b[1].avgReach-a[1].avgReach);
  const ranked=[...L].map(x=>({...x,_er:x.reach?eng(x)/x.reach:0}));
  const topER=[...ranked].sort((a,b)=>b._er-a._er).slice(0,3), topReach=[...ranked].sort((a,b)=>(b.reach||0)-(a.reach||0)).slice(0,3);
  const ins=[];
  if(fmtRows.length>1) ins.push(`<b>${esc(fmtRows[0][0])}</b> teve a melhor taxa de engajamento (${pct(fmtRows[0][1].er)}), contra ${pct(fmtRows[fmtRows.length-1][1].er)} de ${esc(fmtRows[fmtRows.length-1][0])}.`);
  if(wdRows.length>1) ins.push(`Posts de <b>${esc(wdRows[0][0])}</b> tiveram o maior alcance médio (${fmtN(Math.round(wdRows[0][1].avgReach))}).`);
  if(s.saves>s.shares) ins.push(`O público mais <b>salva</b> (${fmtN(s.saves)}) do que compartilha (${fmtN(s.shares)}): conteúdo de consulta funciona; teste ganchos mais compartilháveis.`);
  else if(s.shares>0) ins.push(`O público mais <b>compartilha</b> (${fmtN(s.shares)}) do que salva (${fmtN(s.saves)}): a identificação está forte; transforme os melhores em carrossel de consulta.`);
  if(p.n&&isFinite(p.avgReach)&&p.avgReach>0){ const d=(s.avgReach-p.avgReach)/p.avgReach; ins.push(`Alcance médio por post ${d>=0?'subiu':'caiu'} ${pct(Math.abs(d))} em relação ao mês anterior.`); }
  if(topER[0]) ins.push(`Post com melhor engajamento: “${esc((topER[0].caption||'').slice(0,70))}…” (${pct(topER[0]._er)}). Vale repetir o gancho ou o formato.`);
  const row=x=>`<tr><td>${x.permalink?`<a href="${esc(x.permalink)}" target="_blank" rel="noopener">${esc((x.caption||'(sem legenda)').slice(0,60))}</a>`:esc((x.caption||'').slice(0,60))}<div class="sub">${esc(typeLabel(x.post_type))} · ${x.published_at?new Date(x.published_at).toLocaleDateString('pt-BR'):''}</div></td><td class="num">${fmtN(x.reach)}</td><td class="num">${pct(x._er)}</td></tr>`;
  el.innerHTML=`
    <div class="kpis" style="margin-top:14px">
      <div class="kpi"><span>Posts analisados</span><b>${s.n}</b>${p.n?`<em class="sub">${p.n} no mês anterior</em>`:''}</div>
      <div class="kpi"><span>Alcance total</span><b>${fmtN(s.reach)}</b>${delta(s.reach,p.reach)}</div>
      <div class="kpi"><span>Alcance médio por post</span><b>${fmtN(Math.round(s.avgReach))}</b>${delta(s.avgReach,p.avgReach)}</div>
      <div class="kpi"><span>Taxa de engajamento</span><b>${pct(s.er)}</b>${delta(s.er,p.er)}</div>
    </div>
    <ul class="insights">${ins.map(i=>`<li>${i}</li>`).join('')}</ul>
    <div class="grid2" style="margin-top:12px">
      <div class="tablewrap"><h3 style="font-size:16px;margin:6px 0">Por formato</h3><table><thead><tr><th>Formato</th><th class="num">Posts</th><th class="num">Alcance médio</th><th class="num">Engaj.</th></tr></thead>
        <tbody>${fmtRows.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="num">${v.n}</td><td class="num">${fmtN(Math.round(v.avgReach))}</td><td class="num">${pct(v.er)}</td></tr>`).join('')}</tbody></table></div>
      <div class="tablewrap"><h3 style="font-size:16px;margin:6px 0">Top 3 por engajamento</h3><table><thead><tr><th>Post</th><th class="num">Alcance</th><th class="num">Engaj.</th></tr></thead><tbody>${topER.map(row).join('')}</tbody></table>
        <h3 style="font-size:16px;margin:14px 0 6px">Top 3 por alcance</h3><table><thead><tr><th>Post</th><th class="num">Alcance</th><th class="num">Engaj.</th></tr></thead><tbody>${topReach.map(row).join('')}</tbody></table></div>
    </div>
    <div class="sub" style="margin-top:10px">Engajamento = (curtidas + comentários + compartilhamentos + salvamentos) ÷ alcance. Salvamentos no mês: ${fmtN(s.saves)} · Compartilhamentos: ${fmtN(s.shares)} · Novos seguidores vindos dos posts: ${fmtN(s.follows)}.</div>`;
}

// CSV import (Meta Business Suite, PT ou EN)
const COLS={
  ig_post_id:['post id','identificação da publicação','id da publicação','id do post','identificação do post'],
  permalink:['permalink','link permanente'],
  published_at:['publish time','horário de publicação','hora de publicação','data de publicação'],
  post_type:['post type','tipo de publicação','tipo de post'],
  caption:['description','descrição','legenda'],
  views:['views','visualizações','impressions','impressões'],
  reach:['reach','alcance'],
  likes:['likes','curtidas'],
  comments:['comments','comentários'],
  shares:['shares','compartilhamentos'],
  saves:['saves','salvamentos','salvos'],
  follows:['follows','seguimentos','seguidores']
};
function pick(row,keys){ const hk=Object.keys(row); for(const k of keys){ const h=hk.find(x=>x.trim().toLowerCase()===k); if(h!=null&&row[h]!=='')return row[h]; } return null; }
function num(v){ if(v==null)return 0; const n=parseInt(String(v).replace(/[^\d-]/g,''),10); return isNaN(n)?0:n; }
function parseDate(v){ if(!v)return null; const m=String(v).match(/^(\d{2})\/(\d{2})\/(\d{4})\s*(\d{2}):(\d{2})/); if(m)return new Date(+m[3],+m[2]-1,+m[1],+m[4],+m[5]).toISOString(); const d=new Date(v); return isNaN(d)?null:d.toISOString(); }
$('#csvInput').addEventListener('change',e=>{
  const file=e.target.files[0]; e.target.value=''; if(!file)return;
  Papa.parse(file,{header:true,skipEmptyLines:true,complete:async res=>{
    const rows=res.data.map(r=>({client_id:S.tab,ig_post_id:pick(r,COLS.ig_post_id),permalink:pick(r,COLS.permalink),published_at:parseDate(pick(r,COLS.published_at)),post_type:pick(r,COLS.post_type),caption:pick(r,COLS.caption),
      views:num(pick(r,COLS.views)),reach:num(pick(r,COLS.reach)),likes:num(pick(r,COLS.likes)),comments:num(pick(r,COLS.comments)),shares:num(pick(r,COLS.shares)),saves:num(pick(r,COLS.saves)),follows:num(pick(r,COLS.follows)),imported_at:new Date().toISOString()}))
      .filter(r=>r.ig_post_id);
    if(!rows.length){ toast('Não achei a coluna de ID do post nesse CSV'); return; }
    const {error}=await sb.from('metrics').upsert(rows,{onConflict:'client_id,ig_post_id'});
    if(error)return fail(error);
    // liga métricas aos posts do calendário pelo link
    toast(rows.length+' posts importados'); renderClient();
  },error:fail});
});

}
const swDlg=$('#swDlg'), swForm=$('#swForm'); let editingSw=null;
function openSw(x){ editingSw=x&&x.id?x:null; swForm.reset(); ['niche','format','title','hook','structure','why','example_url'].forEach(k=>{ if(x&&x[k]!=null)swForm[k].value=x[k]; }); $('#swDel').classList.toggle('hidden',!editingSw); swDlg.showModal(); }
swForm.addEventListener('submit',async e=>{
  e.preventDefault(); const f=swForm;
  const row={niche:f.niche.value,format:f.format.value,title:f.title.value.trim(),hook:f.hook.value||null,structure:f.structure.value||null,why:f.why.value||null,example_url:f.example_url.value||null};
  const {error}=await(editingSw?sb.from('swipe').update(row).eq('id',editingSw.id):sb.from('swipe').insert(row)); if(error)return fail(error);
  swDlg.close(); toast('Salvo'); renderSwipe();
});
$('#swDel').onclick=async()=>{ if(!editingSw||!confirm('Excluir este formato?'))return; const {error}=await sb.from('swipe').delete().eq('id',editingSw.id); if(error)return fail(error); swDlg.close(); renderSwipe(); };

boot();
})();
</script>
</body>
</html>
